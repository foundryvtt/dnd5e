name: Green Breath Weapon
ownership:
  default: 0
type: feat
system:
  description:
    value: >-
      <p>You can use your action to exhale destructive poison.</p><p>When you
      use your breath weapon, [[lookup @labels.description.affects
      activity=EIereai1ZidTPdTz]] in a [[lookup @labels.description.template
      activity=EIereai1ZidTPdTz]] must make a Constitution saving throw. The DC
      for this saving throw equals 8 + your Constitution modifier + your
      proficiency bonus. A creature takes 2d6 poison damage on a failed save,
      and half as much damage on a successful one. The damage increases to 3d6
      at 6th level, 4d6 at 11th level, and 5d6 at 16th level.</p><p>After you
      use your breath weapon, you can't use it again until you complete a short
      or long rest.</p>
