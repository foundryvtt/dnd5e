system:
  description:
    value: >-
      <p><em>Potion, Very Rare</em></p><p>One vial of this oil can coat one
      Melee weapon or twenty pieces of ammunition, but only ammunition and Melee
      weapons that are nonmagical and deal Slashing or Piercing damage are
      affected. Applying the oil takes 1 minute, after which the oil magically
      seeps into whatever it coats, turning the coated weapon into a +3 Weapon
      or the coated ammunition into +3 Ammunition.</p><p>This clear, gelatinous
      oil sparkles with tiny, ultrathin silver shards.</p>
