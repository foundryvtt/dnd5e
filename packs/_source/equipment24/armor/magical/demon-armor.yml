  description:
    value: >-
      <p><em>Armor (Any Light, Medium, or Heavy), Very Rare (Requires
      Attunement)</em></p><p>While wearing this armor, you gain a +1 bonus to
      Armor Class, and you know Abyssal. In addition, the armor's clawed
      gauntlets allow your Unarmed Strikes to deal 1d8 Slashing damage instead
      of the usual Bludgeoning damage, and you gain a +1 bonus to the attack and
      damage rolls of your Unarmed Strikes.</p><section class="secret"
      id="secret-i2l0Ym3XkTC4Qm8z"><p><strong>Curse.</strong> Once you don this
      cursed armor, you can't doff it unless you are targeted by a <em>Remove
      Curse</em> spell or similar magic. While wearing the armor, you have
      Disadvantage on attack rolls against demons and on saving throws against
      their spells and special abilities.</p></section>
      <p>@Embed[Compendium.dnd5e.content24.JournalEntry.dmgFoundryRefere.JournalEntryPage.Ok4iCgD25ENgoRxE
