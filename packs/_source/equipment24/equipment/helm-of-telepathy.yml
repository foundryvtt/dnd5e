    value: >-
      <p><em>Wondrous Item, Uncommon (Requires Attunement)</em></p><p>While
      wearing this helm, you have telepathy with a range of 30 feet, and you can
      cast @UUID[Compendium.dnd5e.spells24.Item.phbsplDetectThou]{Detect
      Thoughts} or
      @UUID[Compendium.dnd5e.spells24.Item.phbsplSuggestion]{Suggestion} (save
      DC 13) from the helm. Once either spell is cast from the helm, that spell
      can't be cast from it again until the next dawn.</p>
