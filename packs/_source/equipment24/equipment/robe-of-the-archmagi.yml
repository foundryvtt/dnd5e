  description:
    value: >-
      <p><em>Wondrous Item, Legendary (Requires Attunement by a Sorcerer,
      Warlock, or Wizard)</em></p><p>This elegant garment is made from exquisite
      cloth and adorned with runes.</p><p>You gain these benefits while wearing
      the robe.</p><p><em><strong>Armor.</strong></em> If you aren't wearing
      armor, your base Armor Class is 15 plus your Dexterity
      modifier.</p><p><em><strong>Magic Resistance.</strong></em> You have
      Advantage on saving throws against spells and other magical
      effects.</p><p><em><strong>War Mage.</strong></em> Your spell save DC and
      spell attack bonus each increase by 2.</p><section
      id="secret-IRNV3h4JDt2BjO62" class="secret"><p><strong>Foundry
      Note</strong></p><p>The <strong>Archmagi Armor</strong> Active Effect sets
      your AC and should be disabled if you're still wearing armor.</p><p>The
      <strong>War Mage</strong> Active Effect automatically increases you spell
      save and attack bonus increases.</p></section>
