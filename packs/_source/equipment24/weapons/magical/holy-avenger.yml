  description:
    value: >-
      <p><em>Weapon (Any Simple or Martial), Legendary (Requires Attunement by a
      Paladin)</em></p><p>You gain a +3 bonus to attack rolls and damage rolls
      made with this magic weapon. When you hit a Fiend or an Undead with it,
      that creature takes an extra 2d10 Radiant damage.</p><p>While you hold the
      drawn weapon, it creates a 10-foot Emanation originating from you. You and
      all creatures Friendly to you in the Emanation have Advantage on saving
      throws against spells and other magical effects. If you have 17 or more
      levels in the Paladin class, the size of the Emanation increases to 30
      feet.</p><p>[[10 + floor(@classes.paladin.levels / 17) * 20]]{Emanation
      Size
      (feet)}</p><p>@Embed[Compendium.dnd5e.content24.JournalEntry.dmgFoundryRefere.JournalEntryPage.Ok4iCgD25ENgoRxE
