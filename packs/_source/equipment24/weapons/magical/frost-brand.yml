    value: >-
      <p><em>Weapon
      (@UUID[Compendium.dnd5e.equipment24.Item.phbwepGlaive0000]{Glaive},
      @UUID[Compendium.dnd5e.equipment24.Item.phbwepGreatsword]{Greatsword},
