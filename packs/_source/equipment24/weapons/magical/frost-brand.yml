      @UUID[Compendium.dnd5e.equipment24.Item.phbwepShortsword]{Shortsword}),
      Very Rare (Requires Attunement)</em></p><p>When you hit with an attack
      roll using this magic weapon, the target takes an extra 1d6 Cold damage.
      In addition, while you hold the weapon, you have Resistance to Fire
      damage.</p><p>In freezing temperatures, the weapon sheds Bright Light in a
      10-foot radius and Dim Light for an additional 10 feet.</p><p>When you
      draw this weapon, you can extinguish all nonmagical flames within 30 feet
      of yourself. Once used, this property can't be used again for 1
      hour.</p><p>@Embed[Compendium.dnd5e.content24.JournalEntry.dmgFoundryRefere.JournalEntryPage.Ok4iCgD25ENgoRxE
