  - _id: 8Jju4CVZaIDab6Ju
    name: Dreadful Glare
    type: feat
    img: icons/magic/death/skull-energy-light-purple.webp
    system:
      description:
        value: >-
          <p>The [[lookup @name lowercase]]{monster} targets [[lookup
          @labels.description.affects activity=vBP1Ivo8gjkv4DVp]] it can see
          within [[lookup @labels.description.range activity=vBP1Ivo8gjkv4DVp]]
          of it. If the target can see the [[lookup @name lowercase]]{monster},
          it must succeed on a [[/save]] saving throw against this magic or
          become &amp;reference[frightened] until the end of the [[lookup @name
          lowercase]]{monster}'s next turn.</p><p>If the target fails the saving
          throw by 5 or more, it is also &amp;reference[paralyzed] for the same
          duration. A target that succeeds on the saving throw is immune to the
          [[lookup @item.name]] of all mummies (but not mummy lords) for the
          next 24 hours.</p>
        chat: >-
