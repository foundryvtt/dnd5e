  - _id: UF0mfYsgI4ay6mzv
    name: Possession
    type: feat
    img: icons/magic/control/fear-fright-monster-grin-purple-blue.webp
    system:
      description:
        value: >-
          <p>One humanoid that the [[lookup @name lowercase]]{monster} can see
          within [[lookup @labels.description.range activity=WcBEt039Ueelll14]]
          of it must succeed on a [[/save activity=WcBEt039Ueelll14]] saving
          throw or be possessed by the [[lookup @name lowercase]]{monster}; the
          [[lookup @name lowercase]]{monster} then disappears, and the target is
          &amp;reference[incapacitated] and loses control of its body. The
          [[lookup @name lowercase]]{monster} now controls the body but doesn't
