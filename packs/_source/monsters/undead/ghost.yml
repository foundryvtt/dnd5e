  - _id: lOzkFHeXCdO2FB9X
    name: Horrifying Visage
    type: feat
    img: icons/magic/death/skull-energy-light-purple.webp
    system:
      description:
        value: >-
          <p>Each non-undead creature within [[lookup @target.template.size
          activity=LYjmuZ7QyGDPVBoT]] feet of the [[lookup @name
          lowercase]]{monster} that can see it must succeed on a DC 13 Wisdom
          saving throw or be &amp;reference[frightened] for [[lookup
          @labels.duration activity=LYjmuZ7QyGDPVBoT]]. If the save fails by 5
          or more, the target also ages [[/r 1d4 * 10 #Years aged.]]{1d4 x 10}
          years.</p><p>A frightened target can repeat the saving throw at the
          end of each of its turns, ending the frightened condition on itself on
          a success. If a target's saving throw is successful or the effect ends
          for it, the target is immune to this [[lookup @name
          lowercase]]{monster}'s [[lookup @item.name]] for the next 24 hours.
          The aging effect can be reversed with a
          @UUID[Compendium.dnd5e.spells.Item.WzvJ7G3cqvIubsLk]{greater
          restoration} spell, but only within 24 hours of it occurring.</p>
        chat: >-
          <p>Each non-undead creature within [[lookup @target.template.size
          activity=LYjmuZ7QyGDPVBoT]] feet of the [[lookup @name]]{monster} that
