          succeed on a [[/save]] saving throw or its hit point maximum is
          reduced by an amount equal to the damage taken. This reduction lasts
          until the target finishes a long rest. The target dies if this effect
          reduces its hit point maximum to 0.</p><p>A humanoid slain by this
          attack rises 24 hours later as a
