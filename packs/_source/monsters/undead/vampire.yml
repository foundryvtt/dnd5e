    name: Vampire Weaknesses
    type: feat
    img: icons/magic/time/day-night-sunset-sunrise.webp
    system:
      description:
        value: >-
          <p>The vampire has the following
          flaws:</p><p><em><strong>Forbiddance.</strong></em> The [[lookup @name
          lowercase]]{monster} can't enter a residence without an invitation
          from one of the occupants.</p><p><em><strong>Harmed by Running
          Water.</strong></em> The [[lookup @name lowercase]]{monster} takes
          [[/damage activity=zTY3HiiTYj5yJ7Io]] damage when it ends its turn in
          running water.</p><p><em><strong>Stake to the Heart.</strong></em> The
          [[lookup @name lowercase]]{monster} is destroyed if a piercing weapon
          made of wood is driven into its heart while it is
          &amp;reference[incapacitated apply=false] in its resting
          place.</p><p><em><strong>Sunlight Hypersensitivity.</strong></em> The
          [[lookup @name lowercase]]{monster} takes [[/damage
          activity=3lO6XvaimPKCB5te]] damage when it starts its turn in
          sunlight. While in sunlight, it has disadvantage on attack rolls and
