    name: Bite (Bat or Vampire Form Only)
    type: weapon
    img: icons/magic/death/mouth-bite-fangs-vampire.webp
    system:
      description:
        value: >-
          <p><em>Melee Weapon Attack:</em> [[/attack]], 5 ft., one willing
          creature, or a creature that is &amp;reference[grappled apply=false]
          by the [[lookup @name lowercase]]{monster},
          &amp;reference[incapacitated apply=false], or
          &amp;reference[restrained apply=false]. [[/damage
          extended]].</p><p>The target's hit point maximum is reduced by an
          amount equal to the necrotic damage taken, and the [[lookup @name
          lowercase]]{monster} regains hit points equal to that amount. The
