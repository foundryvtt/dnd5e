  - _id: RHezeN7HzNf2oKYP
    name: Charm
    type: feat
    img: icons/magic/life/heart-shadow-red.webp
    system:
      description:
        value: >-
          <p>The [[lookup @name lowercase]]{monster} targets one humanoid it can
          see within [[lookup @labels.description.range
          activity=kzseXOAXwSg10knT]] of it. If the target can see the [[lookup
          @name lowercase]]{monster}, the target must succeed on a [[/save]]
          saving throw against this magic or be &amp;reference[charmed] by the
          [[lookup @name lowercase]]{monster}. The charmed target regards the
          [[lookup @name lowercase]]{monster} as a trusted friend to be heeded
          and protected. Although the target isn't under the [[lookup @name
          lowercase]]{monster}'s control, it takes the [[lookup @name
          lowercase]]{monster}'s requests or actions in the most favorable way
          it can, and it is a willing target for the [[lookup @name
          lowercase]]{monster}'s
          @UUID[Compendium.dnd5e.monsters.Actor.DDO9lDCDtNHkfShP.Item.uqHuj7Pjf2sjny21]{bite}
          attack.</p><p>Each time the [[lookup @name lowercase]]{monster} or the
          [[lookup @name lowercase]]{monster}'s companions do anything harmful
          to the target, it can repeat the saving throw, ending the effect on
          itself on a success. Otherwise, the effect lasts 24 hours or until the
          [[lookup @name lowercase]]{monster} is destroyed, is on a different
          plane of existence than the target, or takes a bonus action to end the
          effect.</p>
        chat: >-
          <p>The vampire targets one humanoid it can see within 30 ft. of it. If
          the target can see the vampire, the target must make a
          <strong>Wisdom</strong> saving throw against this magic.</p>
