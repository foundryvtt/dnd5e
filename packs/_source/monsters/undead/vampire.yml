  - _id: pVlKFunmE2qxO0pe
    name: Misty Escape
    type: feat
    img: icons/magic/air/air-wave-gust-blue.webp
    system:
      description:
        value: >-
          <p>When it drops to 0 hit points outside its resting place, the
          [[lookup @name lowercase]]{monster} transforms into a cloud of mist
          (as in the
          @UUID[Compendium.dnd5e.monsters.Actor.DDO9lDCDtNHkfShP.Item.BqG5guVa93LaOAn1]{Shapechanger}
          trait) instead of falling &amp;reference[unconscious apply=false],
          provided that it isn't in sunlight or running water. If it can't
          transform, it is destroyed.</p><p>While it has 0 hit points in mist
          form, it can't revert to its [[lookup @name lowercase]]{monster} form,
          and it must reach its resting place within 2 hours or be destroyed.
          Once in its resting place, it reverts to its [[lookup @name
          lowercase]]{monster} form. It is then &amp;reference[paralyzed] until
          it regains at least 1 hit point. After spending 1 hour in its resting
          place with 0 hit points, it regains 1 hit point.</p>
        chat: >-
          <p>A slain vampire transforms into a cloud of mist (as in the
          Shapechanger trait) instead of falling unconscious.</p>
      source:
        custom: ''
        book: ''
