items:
  - _id: BqG5guVa93LaOAn1
    name: Shapechanger
    type: feat
    img: icons/magic/nature/symbol-moon-stars-white.webp
    system:
      description:
        value: >-
          <p>If the [[lookup @name lowercase]]{monster} isn't in sun light or
          running water, it can use its action to polymorph into a Tiny bat or a
          Medium cloud of mist, or back into its true form.</p><p>While in bat
          form, the [[lookup @name lowercase]]{monster} can't speak, its walking
          speed is 5 feet, and it has a flying speed of 30 feet. Its statistics,
          other than its size and speed, are unchanged. Anything it is wearing
          transforms with it, but nothing it is carrying does. It reverts to its
          true form if it dies.</p><p>While in mist form, the [[lookup @name
          lowercase]]{monster} can't take any actions, speak, or manipulate
          objects. It is weightless, has a flying speed of 20 feet, can hover,
          and can enter a hostile creature's space and stop there. In addition,
          if air can pass through a space, the mist can do so without
          &amp;reference[squeezing]{Squeezing}, and it can't pass through water.
          It has advantage on Strength, Dexterity, and Constitution saving
          throws, and it is immune to all nonmagical damage, except the damage
          it takes from sunlight.</p>
        chat: >-
          <p>The [[lookup @name]]{monster} can use its action to polymorph or
          return to its true form.</p>
