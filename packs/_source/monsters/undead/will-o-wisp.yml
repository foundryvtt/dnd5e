        value: >-
          <p>As a bonus action, the [[lookup @name lowercase]]{monster} can
          target one creature it can see within 5 feet of it that has 0 hit
          points and is still alive.</p><p>The target must succeed on a
          [[/save]] saving throw against this magic or die. If the target dies,
          the [[lookup @name lowercase]]{monster} regains [[/healing
          average]].</p>
