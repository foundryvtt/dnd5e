    img: icons/creatures/reptiles/lizard-mouth-glowing-red.webp
    system:
      description:
        value: >-
          <p>Whenever the [[lookup @name lowercase]]{monster} starts its turn
          with 60 hit points or fewer, roll a [[/r d6]]. On a 6, the [[lookup
          @name lowercase]]{monster} goes berserk. On each of its turns while
          berserk, the [[lookup @name lowercase]]{monster} attacks the nearest
          creature it can see. If no creature is near enough to move to and
          attack, the [[lookup @name lowercase]]{monster} attacks an object,
          with preference for an object smaller than itself. Once the [[lookup
          @name lowercase]]{monster} goes berserk, it continues to do so until
          it is destroyed or regains all its hit points.</p>
