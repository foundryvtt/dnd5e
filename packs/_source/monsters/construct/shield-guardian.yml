items:
  - _id: mJoNsESU5X2lBKqn
    name: Bound
    type: feat
    img: icons/equipment/neck/amulet-carved-stone-purple.webp
    system:
      description:
        value: >-
          <p>The [[lookup @name lowercase]]{monster} is magically bound to an
          amulet. As long as the [[lookup @name lowercase]]{monster} and its
          amulet are on the same plane of existence, the amulet's wearer can
          telepathically call the [[lookup @name lowercase]]{monster} to travel
          to it, and the [[lookup @name lowercase]]{monster} knows the distance
          and direction to the amulet. If the [[lookup @name
          lowercase]]{monster} is within 60 feet of the amulet's wearer, half of
          any damage the wearer takes (rounded up) is transferred to the
          [[lookup @name lowercase]]{monster}.</p>
        chat: <p>The shield guardian is magically bound to an amulet. </p>
