  - _id: Ybu3lcQROZT20kj7
    name: Apparatus of the Crab
    type: equipment
    img: icons/containers/barrels/barrel-walnut-steel-brown.webp
    system:
      description:
        value: >-
          <p><em>Wondrous item</em></p><p>This item first appears to be a Large
          sealed iron barrel weighing 500 pounds. The barrel has a hidden catch,
          which can be found with a successful DC 20 Intelligence
          (Investigation) check. Releasing the catch unlocks a hatch at one end
          of the barrel, allowing two Medium or smaller creatures to crawl
          inside. Ten levers are set in a row at the far end, each in a neutral
          position, able to move either up or down. When certain levers are
          used, the apparatus transforms to resemble a giant lobster.</p><p>The
          Apparatus of the Crab is a Large object with the following
          statistics:</p><p><strong>AC</strong>: 20<br><strong>Hit
          Points</strong>: 200<br><strong>Speed</strong>: 30 ft., swim 30 ft.
          (or 0 ft. for both if the legs and tail aren't
          extended)<br><strong>Damage Immunities</strong>: poison,
          psychic</p><p>To be used as a vehicle, the apparatus requires one
          pilot. While the apparatus's hatch is closed, the compartment is
          airtight and watertight. The compartment holds enough air for 10 hours
          of breathing, divided by the number of breathing creatures
          inside.</p><p>The apparatus floats on water. It can also go underwater
          to a depth of 900 feet. Below that, the vehicle takes 2d6 bludgeoning
          damage per minute from pressure.</p><p>A creature in the compartment
          can use an action to move as many as two of the apparatus's levers up
          or down. After each use, a lever goes back to its neutral position.
          Each lever, from left to right, functions as show in the Apparatus of
          the Crab Levers table.</p><table><caption><p><strong>Apparatus of the
          Crab Levers
          table:</strong></p></caption><thead><tr><th><p>Lever</p></th><th><p>Up</p></th><th><p>Down</p></th></tr></thead><tbody><tr><td><p>1</p></td><td><p>Legs
          and tail extend, allowing the apparatus to walk and
          swim.</p></td><td><p>Legs and tail retract, reducing the apparatus's
          speed to 0 and making it unable to benefit from bonuses to
          speed.</p></td></tr><tr><td><p>2</p></td><td><p>Forward window shutter
          opens.</p></td><td><p>Forward window shutter
          closes.</p></td></tr><tr><td><p>3</p></td><td><p>Side window shutters
          open (two per side).</p></td><td><p>Side window shutters close (two
          per side).</p></td></tr><tr><td><p>4</p></td><td><p>Two claws extend
          from the front sides of the apparatus.</p></td><td><p>The claws
          retract.</p></td></tr><tr><td><p>5</p></td><td><p>Each extended claw
          makes the following melee weapon attack: +8 to hit, reach 5 ft., one
          target. Hit: 7 (2d6) bludgeoning damage.</p></td><td><p>Each extended
          claw makes the following melee weapon attack: +8 to hit, reach 5 ft.,
          one target. Hit: The target is Grappled (escape DC
          15).</p></td></tr><tr><td><p>6</p></td><td><p>The apparatus walks or
          swims forward.</p></td><td><p>The apparatus walks or swims
          backward.</p></td></tr><tr><td><p>7</p></td><td><p>The apparatus turns
          90 degrees left.</p></td><td><p>The apparatus turns 90 degrees
          right.</p></td></tr><tr><td><p>8</p></td><td><p>Eyelike fixtures emit
          bright light in a 30-foot radius and dim light for an additional 30
          feet.</p></td><td><p>The light turns
          off.</p></td></tr><tr><td><p>9</p></td><td><p>The apparatus sinks as
          much as 20 feet in liquid.</p></td><td><p>The apparatus rises up to 20
          feet in liquid.</p></td></tr><tr><td><p>10</p></td><td><p>The rear
          hatch unseals and opens.</p></td><td><p>The rear hatch closes and
          seals.</p></td></tr></tbody></table>
