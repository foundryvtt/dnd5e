    name: Charge (Boar or Hybrid Form Only)
    type: feat
    img: icons/creatures/mammals/bull-horns-eyes-glowin-orange.webp
    system:
      description:
        value: >-
          <p>If the wereboar moves at least 15 feet straight toward a target and
          then hits it with its tusks on the same turn, the target takes an
          extra [[/damage average]] damage.</p><p>If the target is a creature,
          it must succeed on a [[/save]] saving throw or be knocked
          &amp;Reference[prone].</p>
        chat: >-
          <p>If the [[lookup @name lowercase]]{monster} moves at least 15 feet
          straight toward a target and then hits it with its tusks on the same
          turn, the target takes extra <em>slashing damage</em>. If the target
          is a creature, it must make aStrength saving throw or be knocked
          &amp;reference[prone].</p>
