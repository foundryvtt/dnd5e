items:
  - _id: N5YFwsrzGuUFrblp
    name: Flying Sword
    type: feat
    img: icons/weapons/swords/sword-runed-glowing.webp
    system:
      description:
        value: >-
          <p>The [[lookup @name lowercase]]{monster} releases its greatsword to
          hover magically in an unoccupied space within 5 feet of it. If the
          [[lookup @name lowercase]]{monster} can see the sword, the [[lookup
          @name lowercase]]{monster} can mentally command it as a bonus action
          to fly up to 50 feet and either make one attack against a target or
          return to the [[lookup @name lowercase]]{monster}'s hands. If the
          hovering sword is targeted by any effect, the [[lookup @name
          lowercase]]{monster} is considered to be holding it. The hovering
          sword falls if the [[lookup @name lowercase]]{monster}
          dies.</p><section id="secret-lQcPEreSKHWmYNO7"
          class="secret"><p>Foundry Note</p><p>Enchant the [[lookup @name
          lowercase]]{monster} greatsword using the activity on this feature,
          granting it a <em><strong>"Command Sword"</strong></em> activity that
          can be used as a bonus action.</p></section>
