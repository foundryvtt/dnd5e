  - _id: iWDQPwdffkW06c2Y
    name: Charge
    type: feat
    img: icons/creatures/mammals/bull-horns-eyes-glowin-orange.webp
    system:
      description:
        value: >-
          <p>If the [[lookup @name lowercase]]{monster} moves at least 20 feet
          straight toward a target and then hits it with a
          @UUID[Compendium.dnd5e.monsters.Actor.G9PENY6nw0xRxCJW.Item.ORrGdhTLKLTKK3BH]{Horn}
          attack on the same turn, the target takes an extra [[/damage average]]
          damage.</p><p>If the target is a creature, it must succeed on a
          [[/save]] saving throw or be knocked &amp;reference[prone].</p>
        chat: >-
