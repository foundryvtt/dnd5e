  - _id: fsAeJDaI0a6sBeFk
    name: Multiple Heads
    type: feat
    img: icons/creatures/reptiles/lizard-mouth-glowing-red.webp
    system:
      description:
        value: >-
          <p>The [[lookup @name lowercase]]{monster} has five heads. While it
          has more than one head, the hydra has advantage on saving throws
          against being &amp;reference[blinded apply=false],
          &amp;reference[charmed apply=false], &amp;reference[deafened
          apply=false], &amp;reference[frightened apply=false],
          &amp;reference[stunned apply=false], and knocked
          &amp;reference[unconscious apply=false].</p><p>Whenever the [[lookup
          @name lowercase]]{monster} takes 25 or more damage in a single turn,
          one of its heads dies. If all its heads die, the [[lookup @name
          lowercase]]{monster} dies.</p><p>At the end of its turn, it grows two
          heads for each of its heads that died since its last turn, unless it
          has taken fire damage since its last turn. The [[lookup @name
          lowercase]]{monster} regains [[/healing]] for each head regrown in
          this way.</p><section id="secret-fb7Nmscdc6QqsOXy"
          class="secret"><p><strong>Foundry Note</strong></p><p>The [[lookup
          @name lowercase]]{monster}'s heads can be kept track of via the
          @UUID[Compendium.dnd5e.monsters.Actor.K4vsSlHqbBAHUDHY.Item.fsAeJDaI0a6sBeFk.ActiveEffect.jALTzc0GXXaDjFNQ]{Hydra
          Head} active effects on it. Apply or remove this effect each time the
          [[lookup @name lowercase]]{monster} regrows or loses
          heads.</p></section>
