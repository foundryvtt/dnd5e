  - _id: Keg9oouX6Vbl9tms
    name: Deadly leap
    type: feat
    img: icons/magic/earth/barrier-stone-brown-green.webp
    system:
      description:
        value: >-
          <p>If the [[lookup @name lowercase]]{monster} jumps at least [[lookup
          @labels.description.range activity=1vGEpDSCHfEAoC4w]] as part of its
          movement, it can then use this action to land on its feet in a space
          that contains one or more other creatures.</p><p>Each of those
          creatures must succeed on a [[/save activity=1vGEpDSCHfEAoC4w]] saving
          throw (target's choice) or be knocked &amp;reference[prone] and take
          [[/damage average activity=1vGEpDSCHfEAoC4w]]. On a successful save,
          the creature takes only half the damage, isn't knocked prone, and is
          pushed 5 feet out of the [[lookup @name lowercase]]{monster}'s space
          into an unoccupied space of the creature's choice. If no unoccupied
          space is within range, the creature instead falls
          &amp;reference[prone] in the [[lookup @name lowercase]]{monster}'s
          space.</p>
        chat: >-
          <p>If the [[lookup @name]]{monster} jumps at least 15 feet as part of
          its movement, it can then use this action to land on its feet in a
          space that contains one or more other creatures. Each of those
          creatures must make a Strength or Dexterity saving throw (target's
          choice) or be knocked &amp;reference[prone].</p>
