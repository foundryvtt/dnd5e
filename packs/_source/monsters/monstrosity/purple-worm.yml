  - _id: dlzFJ5UjbMAfJ6Sb
    name: Bite
    type: weapon
    img: icons/creatures/abilities/mouth-teeth-tongue-purple.webp
    system:
      description:
        value: >-
          <p>[[/attack extended]]. [[/damage extended]].</p><p>If the target is
          a Large or smaller creature, it must succeed on a [[/save
          activity=dnd5eactivity100]] saving throw or be swallowed by the
          [[lookup @name lowercase]]{monster}. A swallowed creature is
          &amp;reference[blinded] and &amp;reference[restrained], it has
          &amp;reference[total cover] against attacks and other effects outside
          the [[lookup @name lowercase]]{monster}, and it takes [[/damage
          average activity=5Ch92u8uWNihu5p1]] damage at the start of each of the
          [[lookup @name lowercase]]{monster}'s turns.</p><p>If the [[lookup
          @name lowercase]]{monster} takes 30 damage or more on a single turn
          from a creature inside it, the [[lookup @name lowercase]]{monster}
          must succeed on a [[/save activity=RtTQzkfIp3upqvoQ]] saving throw at
          the end of that turn or regurgitate all swallowed creatures, which
          fall &amp;reference[prone] in a space within 10 feet of the [[lookup
          @name lowercase]]{monster}. If the [[lookup @name lowercase]]{monster}
          dies, a swallowed creature is no longer restrained by it and can
          escape from the corpse by using 20 feet of movement, exiting
          &amp;reference[prone].</p>
        chat: >-
          <p>The [[lookup @name]]{monster} attacks with its [[lookup
          @item.name]]. If the target is a Large or smaller creature, it must
          make a Dexterity saving throw.</p>
