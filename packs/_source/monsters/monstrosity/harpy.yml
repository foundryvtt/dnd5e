  - _id: QeobH0xuWk2yWmsb
    name: Luring Song
    type: feat
    img: icons/magic/sonic/scream-wail-shout-teal.webp
    system:
      description:
        value: >-
          <p>The [[lookup @name lowercase]]{monster} sings a magical melody.
          Every humanoid and giant within [[lookup @target.template.size
          activity=SStRaAbx3AgLlBAU]] feet of the [[lookup @name
          lowercase]]{monster} that can hear the song must succeed on a [[/save
          activity=SStRaAbx3AgLlBAU]] saving throw or be &amp;reference[charmed]
          until the song ends. The [[lookup @name lowercase]]{monster} must take
          a bonus action on its subsequent turns to continue singing. It can
          stop singing at any time. The song ends if the [[lookup @name
          lowercase]]{monster} is &amp;reference[incapacitated
          apply=false].</p><p>While charmed by the [[lookup @name
          lowercase]]{monster}, a target is &amp;reference[incapacitated] and
          ignores the songs of other harpies. If the charmed target is more than
          5 feet away from the [[lookup @name lowercase]]{monster}, the target
          must move on its turn toward the [[lookup @name lowercase]]{monster}
          by the most direct route, trying to get within 5 feet. It doesn't
          avoid &amp;reference[opportunity attacks], but before moving into
          damaging terrain, such as lava or a pit, and whenever it takes damage
          from a source other than the [[lookup @name lowercase]]{monster}, the
          target can repeat the saving throw. A charmed target can also repeat
          the saving throw at the end of each of its turns. If the saving throw
          is successful, the effect ends on it.</p><p>A target that successfully
          saves is immune to this [[lookup @name lowercase]]{monster}'s song for
          the next 24 hours.</p>
        chat: >-
          <p>The [[lookup @name]]{monster} sings a magical melody. Every
          humanoid and giant within [[lookup @target.template.size
          activity=SStRaAbx3AgLlBAU]] feet of the [[lookup @name]]{monster} that
          can hear the song must make a Wisdom saving throw. A creature can also
          repeat the saving throw at the end of each of its turns.</p>
