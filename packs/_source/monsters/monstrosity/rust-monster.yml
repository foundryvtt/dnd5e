  - _id: yxwZ9AtLMKZ61sTz
    name: Antennae
    type: feat
    img: icons/magic/nature/tree-bare-glow-yellow.webp
    system:
      description:
        value: >-
          <p>The [[lookup @name lowercase]]{monster} corrodes a nonmagical
          ferrous metal object it can see within [[lookup
          @labels.description.range activity=4kalmKCyvd5GxuYh]] of it. If the
          object isn't being worn or carried, the touch destroys a 1-foot cube
          of it. If the object is being worn or carried by a creature, the
          creature can make a [[/save]] saving throw to avoid the [[lookup @name
          lowercase]]{monster}'s touch.</p><p>If the object touched is either
          metal armor or a metal shield being worn or carried, its takes a
          permanent and cumulative -1 penalty to the AC it offers. Armor reduced
          to an AC of 10 or a shield that drops to a +0 bonus is destroyed. If
          the object touched is a held metal weapon, it rusts as described in
          the
          @UUID[Compendium.dnd5e.monsters.Actor.WJsxqbHU28D64lWT.Item.dobpPU4kb00zSkQt]{Rust
          Metal} trait.</p><section id="secret-Z9VSdcLCUA4hKtGq"
