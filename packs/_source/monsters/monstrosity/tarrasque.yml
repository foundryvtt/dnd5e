  - _id: tE9TjxIMLnqDisjv
    name: Reflective Carapace
    type: feat
    img: icons/magic/defensive/barrier-shield-dome-blue-purple.webp
    system:
      description:
        value: >-
          <p>Any time the [[lookup @name lowercase]]{monster} is targeted by a
          @UUID[Compendium.dnd5e.spells.Item.41JIhpDyM9Anm7cs]{magic missile}
          spell, a line spell, or a spell that requires a ranged attack roll,
          roll a d6. On a 1 to 5, the [[lookup @name lowercase]]{monster} is
          unaffected.</p><p>On a 6, the [[lookup @name lowercase]]{monster} is
          unaffected, and the effect is reflected back at the caster as though
          it originated from the [[lookup @name lowercase]]{monster}, turning
          the caster into the target.</p>
        chat: >-
          <p>The tarrasque is unaffected, and the effect is reflected back at
          the caster as though it originated from the tarrasque, turning the
          caster into the target.</p>
