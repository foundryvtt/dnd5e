  - _id: DA34sS4nWGc4OTwm
    name: Crush
    type: weapon
    img: icons/commodities/cloth/cloth-patterned-pink.webp
    system:
      description:
        value: >-
          <p>[[/attack extended]]. [[/damage extended]].</p><p>The [[lookup
          @name lowercase]]{monster} attaches to the target. If the target is
          Medium or smaller and the [[lookup @name lowercase]]{monster} has
          advantage on the attack roll, it attaches by engulfing the target's
          head, and the target is also &amp;reference[blinded] and unable to
          &amp;reference[suffocating]{Breathe} while the [[lookup @name
          lowercase]]{monster} is attached in this way.</p><p>While attached to
          the target, the [[lookup @name lowercase]]{monster} can attack no
          other creature except the target but has advantage on its attack
          rolls. The [[lookup @name lowercase]]{monster}'s speed also becomes 0,
          it can't benefit from any bonus to its speed, and it moves with the
          target.</p><p>A creature can detach the [[lookup @name
          lowercase]]{monster} by making a successful [[/check
          activity=D6cM30tTL0VfB4x1]] check as an action. On its turn, the
          [[lookup @name lowercase]]{monster} can detach itself from the target
          by using 5 feet of movement.</p>
        chat: >-
          <p>The darkmantle attacks with its Crush. The darkmantle attaches to
          the target. While attached to the target, the darkmantle can attack no
          other creature except the target but has advantage on its attack
          rolls. A creature can detach the darkmantle by making a successful
          Strength check as an action.</p>
