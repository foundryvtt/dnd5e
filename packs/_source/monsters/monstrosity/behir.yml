  - _id: 0QJeW80m89X0RLNz
    name: Swallow
    type: feat
    img: icons/creatures/abilities/mouth-teeth-tongue-purple.webp
    system:
      description:
        value: >-
          <p>The [[lookup @name lowercase]]{monster} makes one [[/item
          .4fNbTxkAFYHxDdJX]]{Bite} attack against a Medium or smaller target it
          is &amp;reference[grappling]. If the attack hits, the target is also
          swallowed, and the grapple ends. While swallowed, the target is
          &amp;reference[blinded] and &amp;reference[restrained], it has
          &amp;reference[total cover] against attacks and other effects outside
          the [[lookup @name lowercase]]{monster}, and it takes [[/damage
          average activity=JiBTCgEtAZs60k7R]] damage at the start of each of the
          [[lookup @name lowercase]]{monster}'s turns. A [[lookup @name
          lowercase]]{monster} can have only one creature swallowed at a
          time.</p><p>If the [[lookup @name lowercase]]{monster} takes 30 damage
          or more on a single turn from the swallowed creature, the [[lookup
          @name lowercase]]{monster} must succeed on a [[/save
          activity=2pCVkETAYg7qALRu]] saving throw at the end of that turn or
          regurgitate the creature, which falls prone in a space within 10 feet
          of the [[lookup @name lowercase]]{monster}. If the [[lookup @name
          lowercase]]{monster} dies, a swallowed creature is no longer
          restrained by it and can escape from the corpse by using 15 feet of
          movement, exiting &amp;reference[prone].</p>
        chat: >-
          <p>The [[lookup @name]]{monster} attacks with its [[lookup
          @item.name]].</p>
