items:
  - _id: bKBPawscKpixPeO0
    name: Petrifying Gaze
    type: feat
    img: icons/commodities/treasure/statue-bust-stone-grey.webp
    system:
      description:
        value: >-
          <p>If a creature starts its turn within 30 feet of the [[lookup @name
          lowercase]]{monster} and the two of them can see each other, the
          [[lookup @name lowercase]]{monster} can force the creature to make a
          [[/save]] saving throw if the [[lookup @name lowercase]]{monster}
          isn't &amp;reference[incapacitated apply=false]. On a failed save, the
          creature magically begins to turn to stone and is
          &amp;reference[restrained]. It must repeat the saving throw at the end
          of its next turn. On a success, the effect ends. On a failure, the
          creature is &amp;reference[petrified] until freed by the
          @UUID[Compendium.dnd5e.spells.Item.WzvJ7G3cqvIubsLk]{greater
          restoration} spell or other magic.</p><p>A creature that isn't
          &amp;reference[surprise]{Surprised} can avert its eyes to avoid the
          saving throw at the start of its turn. If it does so, it can't see the
          [[lookup @name lowercase]]{monster} until the start of its next turn,
          when it can avert its eyes again. If it looks at the [[lookup @name
          lowercase]]{monster} in the meantime, it must immediately make the
          save.</p><p>If the [[lookup @name lowercase]]{monster} sees its
          reflection within 30 feet of it in &amp;reference[bright light], it
          mistakes itself for a rival and targets itself with its gaze.</p>
        chat: >-
          <p>The basilisk can force the creature to make a
          <strong>Constitution</strong> saving throw. It must repeat the saving
          throw at the end of its next turn. A creature that isn't surprised can
          avert its eyes to avoid the saving throw at the start of its turn. If
          it does so, it can't see the basilisk until the start of its next
          turn, when it can avert its eyes again. If it looks at the basilisk in
          the meantime, it must immediately make the save.</p>
      source:
