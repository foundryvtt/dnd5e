    system:
      description:
        value: >-
          <p>If the [[lookup @name lowercase]]{monster} moves at least 10 feet
          straight toward a target and then hits it with a
          @UUID[Compendium.dnd5e.monsters.Actor.pOPQU4UnR27zA0jf.Item.zTqVT0QztTuMOv0e]{Gore}
          attack on the same turn, the target takes an extra [[/damage average]]
          damage.</p><p>If the target is a creature, it must succeed on a
          [[/save]] saving throw or be pushed up to 10 feet away and knocked
          &amp;reference[prone].</p>
        chat: >-
          <p>If the minotaur moves at least 10 ft. straight toward a target and
          then hits it with a gore attack on the same turn, the target takes
          extra <em>piercing damage</em>. If the target is a creature, it must
          make a <strong>Strength</strong> saving throw or be pushed up to 10
          ft. away and knocked prone.</p>
