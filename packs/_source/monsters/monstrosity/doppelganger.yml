  - _id: YIoB9xCKEcrrPRt9
    name: Read Thoughts
    type: feat
    img: icons/magic/control/hypnosis-mesmerism-watch.webp
    system:
      description:
        value: >-
          <p>The [[lookup @name lowercase]]{monster} magically reads the surface
          thoughts of [[lookup @labels.description.affects
          activity=2oQ9P8HQppd6D9n8]] within [[lookup @labels.description.range
          activity=2oQ9P8HQppd6D9n8]] of it. The effect can penetrate barriers,
          but 3 feet of wood or dirt, 2 feet of stone, 2 inches of metal, or a
          thin sheet of lead blocks it.</p><p>While the target is in range, the
          [[lookup @name lowercase]]{monster} can continue reading its thoughts,
          as long as the [[lookup @name lowercase]]{monster}'s concentration
          isn't broken (as if concentrating on a spell). While reading the
          target's mind, the [[lookup @name lowercase]]{monster} has advantage
          on Wisdom (Insight) and Charisma (Deception, Intimidation, and
          Persuasion) checks against the target.</p>
        chat: >-
          <p>The [[lookup @name]]{monster} magically reads the surface thoughts
          of [[lookup @labels.description.affects activity=2oQ9P8HQppd6D9n8]]
