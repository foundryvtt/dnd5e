items:
  - _id: KmzlUGMXUhY2HubE
    name: Petrifying Gaze
    type: feat
    img: icons/commodities/treasure/statue-bust-stone-grey.webp
    system:
      description:
        value: >-
          <p>When a creature that can see the [[lookup @name
          lowercase]]{monster}'s eyes starts its turn within [[lookup
          @target.template.size activity=LoXmK0mBZ0hatvaU]] feet of the [[lookup
          @name lowercase]]{monster}, the [[lookup @name lowercase]]{monster}
          can force it to make a [[/save activity=LoXmK0mBZ0hatvaU]] saving
          throw if the [[lookup @name lowercase]]{monster} isn't
          &amp;reference[incapacitated apply=false] and can see the creature. If
          the saving throw fails by 5 or more, the creature is instantly
          &amp;reference[petrified]. Otherwise, a creature that fails the save
          begins to turn to stone and is &amp;reference[restrained]. The
          restrained creature must repeat the saving throw at the end of its
          next turn, becoming &amp;reference[petrified] on a failure or ending
          the effect on a success. The petrification lasts until the creature is
          freed by the
          @UUID[Compendium.dnd5e.spells.Item.WzvJ7G3cqvIubsLk]{greater
          restoration} spell or other magic.</p><p>Unless
          &amp;reference[surprise]{Surprised}, a creature can avert its eyes to
          avoid the saving throw at the start of its turn. If the creature does
          so, it can't see the [[lookup @name lowercase]]{monster} until the
          start of its next turn, when it can avert its eyes again. If the
          creature looks at the [[lookup @name lowercase]]{monster} in the
          meantime, it must immediately make the save. If the [[lookup @name
          lowercase]]{monster} sees itself reflected on a polished surface
          within 30 feet of it and in an area of &amp;reference[bright light],
          the medusa is, due to its curse, affected by its own gaze.</p>
        chat: >-
          <p>The medusa can force it to make a <strong>Constitution</strong>
          saving throw. The restrained creature must repeat the saving throw at
          the end of its next turn, becoming petrified on a failure or ending
          the effect on a success. The petrification lasts until the creature is
          freed by the greater restoration spell or other magic. Unless
          surprised, a creature can avert its eyes to avoid the saving throw at
          the start of its turn. If the creature does so, it can't see the
          medusa until the start of its next turn, when it can avert its eyes
          again. If the creature looks at the medusa in the meantime, it must
          immediately make the save. If the medusa sees itself reflected on a
          polished surface within <strong>30 ft.</strong> of it and in an area
          of bright light, the medusa is, due to its curse, affected by its own
          gaze.</p>
