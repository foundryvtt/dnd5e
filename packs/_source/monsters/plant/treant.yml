  - _id: 8uUyRr6Ho7Yvx8pP
    name: Animate Trees
    type: feat
    img: icons/magic/nature/tree-animated-squint.webp
    system:
      description:
        value: >-
          <p>The [[lookup @name lowercase]]{monster} magically animates one or
          two trees it can see within [[lookup @labels.description.range
          activity=1SrLlYGeLgzdmSwc]] of it. These trees have the same
          statistics as a [[lookup @name lowercase]]{monster}, except they have
          Intelligence and Charisma scores of 1, they can't speak, and they have
          only the
          @UUID[Compendium.dnd5e.monsters.Actor.NB6wUgVqeOQtsQKu.Item.lisZZTaupqInGEi1]{slam}
          action option.</p><p>An animated tree acts as an ally of the [[lookup
          @name lowercase]]{monster}. The tree remains animate for [[lookup
          @labels.duration activity=1SrLlYGeLgzdmSwc]] or until it dies; until
          the [[lookup @name lowercase]]{monster} dies or is more than 120 feet
          from the tree; or until the [[lookup @name lowercase]]{monster} takes
          a bonus action to turn it back into an inanimate tree. The tree then
          takes root if possible.</p>
