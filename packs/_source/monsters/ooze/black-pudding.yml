  - _id: wvlDMuDDdk7peoPa
    name: Corrosive Form
    type: feat
    img: icons/commodities/stone/ore-chunk-black.webp
    system:
      description:
        value: >-
          <p>A creature that touches the [[lookup @name lowercase]]{monster} or
          hits it with a melee attack while within 5 feet of it takes [[/damage
          average]] damage. Any nonmagical weapon made of metal or wood that
          hits the [[lookup @name lowercase]]{monster} corrodes.</p><p>After
          dealing damage, the weapon takes a permanent and cumulative -1 penalty
          to damage rolls. If its penalty drops to -5, the weapon is destroyed.
          Nonmagical ammunition made of metal or wood that hits the pudding is
          destroyed after dealing damage. The pudding can eat through
          2-inch-thick, nonmagical wood or metal in 1 round.</p><section
