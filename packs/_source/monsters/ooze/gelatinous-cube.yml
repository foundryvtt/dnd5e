  - _id: 6PuULfBzy5vpBSFI
    name: Engulf
    type: feat
    img: icons/creatures/slimes/slime-giant-face-eyes.webp
    system:
      description:
        value: >-
          <p>The [[lookup @name lowercase]]{monster} moves up to its speed.
          While doing so, it can enter Large or smaller creatures' spaces.
          Whenever the [[lookup @name lowercase]]{monster} enters a creature's
          space, the creature must make a [[/save activity=nGINyQKTsYq10OA0]]
          saving throw. On a successful save, the creature can choose to be
          pushed 5 feet back or to the side of the [[lookup @name
          lowercase]]{monster}. A creature that chooses not to be pushed suffers
          the consequences of a failed saving throw.</p><p>On a failed save, the
          [[lookup @name lowercase]]{monster} enters the creature's space, and
          the creature takes [[/damage average activity=nGINyQKTsYq10OA0]]
          damage and is engulfed. The engulfed creature can't
          &amp;reference[suffocating]{Breathe}, is &amp;reference[restrained],
          and takes [[/damage average activity=sDRiVB3bhk4S5XZI]] damage at the
          start of each of the [[lookup @name lowercase]]{monster}'s turns. When
          the [[lookup @name lowercase]]{monster} moves, the engulfed creature
          moves with it. An engulfed creature can try to escape by taking an
          action to make a [[/check activity=LMPyxWOrUotM7OLs]] check. On a
          success, the creature escapes and enters a space of its choice within
          5 feet of the [[lookup @name lowercase]]{monster}.</p>
        chat: >-
          <p>Whenever the [[lookup @name]]{monster} enters a creature's space,
          the creature must make a Dexterity saving throw. On a successful save,
          the creature can choose to be pushed 5 feet back or to the side of the
          [[lookup @name]]{monster}. A creature that chooses not to be pushed
          suffers the consequences of a failed saving throw.</p>
      source:
