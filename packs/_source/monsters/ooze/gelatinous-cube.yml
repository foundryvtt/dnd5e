  - _id: m8prrQUwqGwX6Jyk
    name: Ooze Cube
    type: feat
    img: icons/magic/water/barrier-ice-water-cube.webp
    system:
      description:
        value: >-
          <p>The [[lookup @name lowercase]]{monster} takes up its entire space.
          Other creatures can enter the space, but a creature that does so is
          subjected to the cube's
          @UUID[Compendium.dnd5e.monsters.Actor.3fzQVYQhXxCXRa2o.Item.6PuULfBzy5vpBSFI]{Engulf}
          and has disadvantage on the saving throw. Creatures inside the
          [[lookup @name lowercase]]{monster} can be seen but have
          &amp;reference[total cover].</p><p>A creature within 5 feet of the
          [[lookup @name lowercase]]{monster} can take an action to pull a
          creature or object out of the [[lookup @name lowercase]]{monster}.
          Doing so requires a successful [[/check]] check, and the creature
          making the attempt takes [[/damage average]] damage. The [[lookup
          @name lowercase]]{monster} can hold only one Large creature or up to
          four Medium or smaller creatures inside it at a time.</p>
