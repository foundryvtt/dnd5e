    name: Corrode Metal
    type: feat
    img: icons/commodities/stone/ore-chunk-magma-brown.webp
    system:
      description:
        value: >-
          <p>Any nonmagical weapon made of metal that hits the [[lookup @name
          lowercase]]{monster} corrodes. After dealing damage, the weapon takes
          a permanent and cumulative -1 penalty to damage rolls.</p><p>If its
          penalty drops to -5, the weapon is destroyed. Nonmagical ammunition
          made of metal that hits the [[lookup @name lowercase]]{monster} is
          destroyed after dealing damage. The [[lookup @name
          lowercase]]{monster} can eat through 2-inch-thick, nonmagical metal in
          1 round.</p><section id="secret-3w7p9RfuLKPgT6FQ"
