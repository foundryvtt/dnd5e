    system:
      description:
        value: >-
          <p>The [[lookup @name lowercase]]{monster} slams creatures
          &amp;reference[grappled apply=false] by it into each other or a solid
          surface. Each creature must succeed on a [[/save]] saving throw or
          take [[/damage average]] damage and be &amp;Reference[stunned
          apply=false] until the end of the [[lookup @name lowercse]]{monster}'s
          next turn.</p><p>On a successful save, the target takes half the
          bludgeoning damage and isn't stunned.</p>
