          <p>[[/attack extended]]. [[/damage extended]].</p><p>If the target is
          a creature, it must succeed on a [[/save]] saving throw against
          disease or become &amp;Reference[poisoned] until the disease is cured.
          Every 24 hours that elapse, the target must repeat the saving throw,
          reducing its hit point maximum by [[/damage maximum 1d10]]{5 (1d10)}
