    name: Bite
    type: weapon
    img: icons/creatures/abilities/mouth-teeth-rows-white.webp
    system:
      description:
        value: >-
          <p>[[/attack extended]]. [[/damage extended]], and if the target is
          Large or smaller, the cloaker attaches to it.</p><p>If the [[lookup
          @name lowercase]]{monster} has advantage against the target, the
          [[lookup @name lowercase]]{monster} attaches to the target's head, and
          the target is &amp;Reference[blinded] and unable to
          &amp;Reference[suffocation apply=false]{Breathe} while the [[lookup
          @name lowercase]]{monster} is attached. While attached, the [[lookup
          @name lowercase]]{monster} can make this attack only against the
          target and has advantage on the attack roll. The [[lookup @name
          lowercase]]{monster} can detach itself by spending 5 feet of its
          movement. A creature, including the target, can take its action to
          detach the cloaker by succeeding on a [[/check]] check.</p>
        chat: >-
          <p>The [[lookup @name]]{monster} attacks with its [[lookup
          @item.name]]. A creature, including the target, can take its action to
          detach the [[lookup @name]]{monster} by succeeding on a Strength
          check.</p>
