  - _id: 4LYRJH02EsSnZUNc
    name: Trampling Charge
    type: feat
    img: icons/creatures/mammals/bull-horns-eyes-glowin-orange.webp
    system:
      description:
        value: >-
          <p>If the mammoth moves at least 20 feet straight toward a creature
          and then hits it with a
          @UUID[Compendium.dnd5e.monsters.Actor.MiYRAIHwm9It1in8.Item.S7i3GTdoo6tyc2wL]{gore}
          attack on the same turn, that target must succeed on a [[/save]]
          saving throw or be knocked &amp;Reference[prone].</p><p>If the target
          is prone, the [[lookup @name lowercase]]{monster} can make one [[/item
          .Hx541foatcQiMSZj]]{stomp} attack against it as a bonus action.</p>
        chat: >-
          <p>If the mammoth moves at least <strong>20 ft.</strong> straight
          toward a creature and then hits it with a gore attack on the same
          turn, that target must succeed on a Strength saving throw.</p>
