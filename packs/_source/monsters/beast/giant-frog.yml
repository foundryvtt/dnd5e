    name: Swallow
    type: feat
    img: icons/creatures/abilities/mouth-teeth-tongue-purple.webp
    system:
      description:
        value: >-
          <p>The [[lookup @name lowercase]]{monster} makes one [[/item
          .lYSWskOMRCVLyWLZ]]{Bite} attack against a Snall or smaller target it
          is &amp;reference[grappling]. If the attack hits, the target is
          swallowed, and the grapple ends.</p><p>The swallowed target is
          &amp;reference[blinded] and &amp;reference[restrained], it has
          &amp;reference[total cover] against attacks and other effects outside
          the [[lookup @name lowercase]]{monster}, and it takes [[/damage
          average activity=hjeShYMsNTvN1QF9]] damage at the start of each of the
          [[lookup @name lowercase]]{monster}'s turns. The [[lookup @name
          lowercase]]{monster} can have only one target swallowed at a
          time.</p><p>If the [[lookup @name lowercase]]{monster} dies, a
          swallowed creature is no longer restrained by it and can escape from
          the corpse using 5 feet of movement, exiting
          &amp;reference[prone].</p>
        chat: <p>The Giant Toad attacks with its Swallow.</p>
