type: feat
system:
  description:
    value: >-
      <p>Starting at 2nd level, your speed increases by 10 feet while you are
      not wearing armor or wielding a shield. This bonus increases when you
      reach certain monk levels, as shown in the Monk table.</p>

      <p>At 9th level, you gain the ability to move along vertical surfaces and
      across liquids on your turn without falling during the move.</p>
