  description:
    value: >-
      <p>You are the recipient of a legacy that grants you supernatural
      abilities. Choose a legacy from the Fiendish Legacies table. You gain the
      level 1 benefit of the chosen legacy.</p><p>When you reach character
      levels 3 and 5, you learn a higher-level spell, as shown on the table. You
      always have that spell prepared. You can cast it once without a spell
      slot, and you regain the ability to cast it in that way when you finish a
      Long Rest. You can also cast the spell using any spell slots you have of
      the appropriate level. Intelligence, Wisdom, or Charisma is your
      spellcasting ability for the spells you cast with this trait (choose the
      ability when you select the legacy).</p><table><caption><p>Fiendish
      Legacies</p></caption><thead><tr><td><p>Lineage</p></td><td><p>Level
      1</p></td><td><p>Level 3</p></td><td><p>Level
      5</p></td></tr></thead><tbody><tr><td><p>@UUID[Compendium.dnd5e.origins24.Item.phbsptAbyssalLeg]{Abyssal}</p></td><td><p>You
      have &amp;Reference[Resistance] to Poison damage.You also know the
      <em>@UUID[Compendium.dnd-players-handbook.spells.Item.phbsplPoisonSpra]{Poison
      Spray}</em>
      cantrip.</p></td><td><p><em>@UUID[Compendium.dnd-players-handbook.spells.Item.phbsplRayofSickn]{Ray
      of
      Sickness}</em></p></td><td><p><em>@UUID[Compendium.dnd-players-handbook.spells.Item.phbsplHoldPerson]{Hold
      Person}</em></p></td></tr><tr><td><p>@UUID[Compendium.dnd5e.origins24.Item.phbsptChthonicLe]{Chthonic}</p></td><td><p>You
      have &amp;Reference[Resistance] to Necrotic damage.You also know the
      <em>@UUID[Compendium.dnd-players-handbook.spells.Item.phbsplChillTouch]{Chill
