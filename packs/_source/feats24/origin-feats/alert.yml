name: Alert
system:
  description:
    value: >-
      <p>You gain the following benefits.</p><p><strong>Initiative
      Proficiency.</strong> When you roll Initiative, you can add your
      Proficiency Bonus to the roll.</p><p><strong>Initiative Swap.</strong>
      Immediately after you roll Initiative, you can swap your Initiative with
      the Initiative of one willing ally in the same combat. You can't make this
      swap if you or the ally has the &amp;Reference[Incapacitated]
      condition.</p><section id="secret-yzfXk3D5M1jv9ixH"
      class="secret"><p><strong>Foundry Note</strong></p><p>This feature
      automatically includes the bonus to your Initiative.</p></section>
