system:
  description:
    value: >-
      <p>A creature subjected to this poison must succeed on a [[/save]] saving
      throw or take [[/damage average]] damage and become
      &amp;Reference[poisoned apply=false]{poisoned}. The poisoned creature must
      repeat the saving throw every 24 hours, taking [[/damage average]] damage
      on a failed save. Until this poison ends, the damage the poison deals
      can't be healed by any means. After seven successful saving throws, the
      effect ends and the creature can heal normally.</p>
