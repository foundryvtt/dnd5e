system:
  description:
    value: >-
      <p>This poison is typically made only by the drow, and only in a place far
      removed from sunlight. A creature subjected to this poison must succeed on
      a [[/save]] saving throw or be &amp;Reference[poisoned
      apply=false]{poisoned} for 1 hour. If the saving throw fails by 5 or more,
      the creature is also &amp;Reference[unconscious apply=false]{unconscious}
      while poisoned in this way. The creature wakes up if it takes damage or if
      another creature takes an action to shake it awake.</p>
