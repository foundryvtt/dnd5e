_id: EJFql4aNWHHJSxT9
name: Wand of Fear
type: equipment
img: icons/weapons/staves/staff-animal-skull-horn-brown.webp
system:
  description:
    value: >-
      <p><em>Wand (requires attunement)</em></p><p>This wand has [[lookup
      @item.uses.max]] charges for the following properties. It regains 1d6 + 1
      expended charges daily at dawn. If you expend the wand's last charge, roll
      a d20. On a 1, the wand crumbles into ashes and is
      destroyed.</p><p><strong>Command</strong>. While holding the wand, you can
      use an action to expend 1 charge and command another creature to flee or
      grovel, as with the
      @UUID[Compendium.dnd5e.spells.Item.arzCrMRgcNiQuh43]{Command} spell (save
      DC [[lookup @spell.challenge.save
      activity=J1oQUVbZNLMFnm4f]]).</p><p><strong>Cone of Fear</strong>. While
      holding the wand, you can use an action to expend 2 charges, causing the
      wand's tip to emit a [[lookup @labels.description.template
      activity=zj1bSgRYmMvM3xaO]] of amber light. Each creature in the cone must
      succeed on a [[/save activity=zj1bSgRYmMvM3xaO]] saving throw or become
      &amp;reference[frightened] of you for [[lookup @labels.duration
      activity=zj1bSgRYmMvM3xaO]]. While it is frightened in this way, a
      creature must spend its turns trying to move as far away from you as it
      can, and it can't willingly move to a space within 30 feet of you. It also
      can't take reactions. For its action, it can use only the
      &amp;reference[Dash] action or try to escape from an effect that prevents
      it from moving. If it has nowhere it can move, the creature can use the
      &amp;reference[Dodge] action. At the end of each of its turns, a creature
      can repeat the saving throw, ending the effect on itself on a success.</p>
