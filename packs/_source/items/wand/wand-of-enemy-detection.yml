system:
  description:
    value: >-
      <p><em>Wand (requires attunement)</em></p><p>This wand has [[lookup
      @item.uses.max]] charges. While holding it, you can use an action and
      expend 1 charge to speak its command word. For the next [[lookup
      @labels.duration activity=8rw7aoQH53r3yP40]], you know the direction of
      the nearest creature hostile to you within [[lookup
      @labels.description.range activity=8rw7aoQH53r3yP40]], but not its
      distance from you. The wand can sense the presence of hostile creatures
      that are ethereal, &amp;reference[invisible apply=false], disguised, or
      hidden, as well as those in plain sight. The effect ends if you stop
      holding the wand.</p><p>The wand regains 1d6 + 1 expended charges daily at
      dawn. If you expend the wand's last charge, roll a d20. On a 1, the wand
      crumbles into ashes and is destroyed.</p>
