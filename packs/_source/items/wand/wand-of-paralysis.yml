system:
  description:
    value: >-
      <p><em>Wand (requires attunement by a spellcaster)</em></p><p>This wand
      has [[lookup @item.uses.max]] charges. While holding it, you can use an
      action to expend 1 of its charges to cause a thin blue ray to streak from
      the tip toward [[lookup @labels.description.affects
      activity=Nz0tgKO1NqwN8vhb]] you can see within [[lookup
      @labels.description.range activity=Nz0tgKO1NqwN8vhb]] of you. The target
      must succeed on a [[/save]] saving throw or be &amp;reference[paralyzed]
      for [[lookup @labels.duration activity=Nz0tgKO1NqwN8vhb]]. At the end of
      each of the target's turns, it can repeat the saving throw, ending the
      effect on itself on a success.</p><p>The wand regains 1d6 + 1 expended
      charges daily at dawn. If you expend the wand's last charge, roll a d20.
      On a 1, the wand crumbles into ashes and is destroyed.</p>
