_id: 2YNqk5zm9jDTvd7q
name: Sphere of Annihilation
type: equipment
img: icons/magic/unholy/orb-beam-pink.webp
system:
  description:
    value: >-
      <p><em>Wondrous item</em></p><p>This 2-foot-diameter black sphere is a
      hole in the multiverse, hovering in space and stabilized by a magical
      field surrounding it.</p><p>The sphere obliterates all matter it passes
      through and all matter that passes through it. Artifacts are the
      exception. Unless an artifact is susceptible to damage from a Sphere of
      Annihilation, it passes through the sphere unscathed. Anything else that
      touches the sphere but isn't wholly engulfed and obliterated by it takes
      [[/damage activity=WHOA3keIbG3sTIrB]] damage.</p><p>The sphere is
      stationary until someone controls it. If you are within [[lookup
      @labels.description.range activity=PDhBrsHGJhPBcRAE]] of an uncontrolled
      sphere, you can use an action to make a [[/check
      activity=PDhBrsHGJhPBcRAE]] check. On a success, the sphere levitates in
      one direction of your choice, up to a number of feet equal to 5 × your
      Intelligence modifier (minimum 5 feet). On a failure, the sphere moves 10
      feet toward you. A creature whose space the sphere enters must succeed on
      a [[/save activity=KnJt0XmxSbBdX49M]] saving throw or be touched by it,
      taking [[/damage activity=KnJt0XmxSbBdX49M]] damage.</p><p>If you attempt
      to control a sphere that is under another creature's control, you make an
      Intelligence (Arcana) check contested by the other creature's Intelligence
      (Arcana) check. The winner of the contest gains control of the sphere and
      can levitate it as normal.</p><p>If the sphere comes into contact with a
      planar portal, such as that created by the
      @UUID[Compendium.dnd5e.spells.Item.XbwGq5kDJNvAxNXV]{gate} spell, or an
      extradimensional space, such as that within a portable hole, the GM
      determines randomly what happens, using the
      @UUID[Compendium.dnd5e.tables.RollTable.hHR0Zw75o9PXYl4c]{Sphere of
      Annihilation} table.</p>
