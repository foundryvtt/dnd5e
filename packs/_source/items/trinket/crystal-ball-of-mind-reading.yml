system:
  description:
    value: >-
      <p><em>Wondrous item (requires attunement)</em></p><p>The Crystal Ball is
      about 6 inches in diameter. While touching it, you can cast the
      @UUID[Compendium.dnd5e.spells.Item.fVbCxFRaORalHB20]{scrying} spell (save
      DC [[lookup @spell.challenge.save activity=tZv4jpd4zviSzUWu]]) with
      it.</p><p>You can use an action to cast the
      @UUID[Compendium.dnd5e.spells.Item.ppWAAEul0QHtm4er]{detect thoughts}
      spell (save DC [[lookup @spell.challenge.save activity=fRkGCqgiCHP528xk]])
      while you are scrying with the Crystal Ball, targeting creatures you can
      see within 30 feet of the spell's sensor. You don't need to concentrate on
      this detect thoughts to maintain it during its duration, but it ends if
      scrying ends.</p>
