name: Horn of Blasting
type: consumable
img: icons/tools/instruments/horn-flared-wood.webp
system:
  description:
    value: >-
      <p><em>Wondrous item</em></p><p>You can use an action to speak the horn's
      command word and then blow the horn, which emits a thunderous blast in a
      [[lookup @labels.description.template activity=hcPhRa7kaEKBUl49]] that is
      audible 600 feet away. Each creature in the cone must make a [[/save
      activity=hcPhRa7kaEKBUl49]] saving throw. On a failed save, a creature
      takes [[/damage average activity=hcPhRa7kaEKBUl49]] damage and is
      &amp;reference[deafened] for [[lookup @labels.duration
      activity=hcPhRa7kaEKBUl49]]. On a successful save, a creature takes half
      as much damage and isn't deafened. Creatures and objects made of glass or
      crystal have disadvantage on the saving throw and take 10d6 thunder damage
      instead of 5d6.</p><p>Each use of the horn's magic has a 20 percent chance
      of causing the horn to explode. The explosion deals 10d6 fire damage to
      the blower and destroys the horn.</p>
