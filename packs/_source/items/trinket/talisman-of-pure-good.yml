_id: iB3gunzgxZ8xK6Z5
name: Talisman of Pure Good
type: consumable
img: icons/equipment/neck/pendant-faceted-silver-green.webp
system:
  description:
    value: >-
      <p><em>Wondrous item, (requires attunement by a creature of good
      alignment)</em></p><p>This talisman is a mighty symbol of goodness. A
      creature that is neither good nor evil in alignment takes [[/damage
      activity=NHlT1xOujDFWegFu]] damage upon touching the talisman. An evil
      creature takes [[/damage activity=R7YK5cZ7HZ8Z25Pl]] damage upon touching
      the talisman. Either sort of creature takes the damage again each time it
      ends its turn holding or carrying the talisman.</p><p>If you are a good
      cleric or paladin, you can use the talisman as a holy symbol, and you gain
      a +2 bonus to spell attack rolls while you wear or hold it.</p><p>The
      talisman has 7 charges. If you are wearing or holding it, you can use an
      action to expend 1 charge from it and choose [[lookup
      @labels.description.affects activity=XF0eIVDXqVLUo7YL]] you can see on the
      ground within [[lookup @labels.description.range
      activity=XF0eIVDXqVLUo7YL]] of you. If the target is of evil alignment, a
      flaming fissure opens under it. The target must succeed on a [[/save]]
      saving throw or fall into the fissure and be destroyed, leaving no
      remains. The fissure then closes, leaving no trace of its existence. When
      you expend the last charge, the talisman disperses into motes of golden
      light and is destroyed.</p>
