name: Carpet of Flying (5x7)
type: equipment
img: icons/commodities/cloth/cloth-bolt-embroidered-pink.webp
system:
  description:
    value: >-
      <p><em>Wondrous item</em></p><p>You can speak the carpet's command word as
      an action to make the carpet hover and fly. It moves according to your
      spoken directions, provided that you are within [[lookup
      @labels.description.range activity=i2xHF00Mf6MtoUJ6]] of it.</p><p>This
      carpet is 5 ft. x 7 ft. and has a speed of 40 feet carrying up to 600 lb,
      or half that speed when carrying up to 1200 lb.</p><p>Four sizes of carpet
      of flying exist. The GM chooses the size of a given carpet or determines
      it randomly from the
      @UUID[Compendium.dnd5e.tables.RollTable.Z2OG7jt9R8zofxnJ]{Carpet of
      Flying} table.</p>
