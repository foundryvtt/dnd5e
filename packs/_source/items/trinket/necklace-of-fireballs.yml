system:
  description:
    value: >-
      <p><em>Wondrous item</em></p><p>This necklace has 1d6 + 3 beads hanging
      from it. You can use an action to detach a bead and throw it up to
      [[lookup @labels.description.range activity=C8zhwUVACrcYrfbe]] away. When
      it reaches the end of its trajectory, the bead detonates as a 3rd-level
      @UUID[Compendium.dnd5e.spells.Item.ztgcdrWPshKRpFd0]{fireball} spell (save
      DC [[lookup @spell.challenge.save activity=C8zhwUVACrcYrfbe]]).</p><p>You
      can hurl multiple beads, or even the whole necklace, as one action. When
      you do so, increase the level of the fireball by 1 for each bead beyond
      the first.</p><section id="secret-BPYFYGO4aUSbDiBj" class="secret
      foundry-note"><p><strong>Foundry Note</strong></p><p>The 9 charges
      represent the maximum number of beads possible to find; please adjust as
      required. The Other Formula button can be used to roll the additional
      damage for extra beads thrown.</p><p>Additionally, here is a price guide
      depending on the number of beads still remaining. These prices are a guide
      only and should be adjusted accordingly to reflect the Dungeon Master's
      world:</p><table><thead><tr><td><p><strong>Number of
      Beads</strong></p></td><td><p><strong>Price
      (gp)</strong></p></td></tr></thead><tbody><tr><td><p>8</p></td><td><p>30,720</p></td></tr><tr><td><p>7</p></td><td><p>15,360</p></td></tr><tr><td><p>6</p></td><td><p>7680</p></td></tr><tr><td><p>5</p></td><td><p>3840</p></td></tr><tr><td><p>4</p></td><td><p>1600</p></td></tr><tr><td><p>3</p></td><td><p>960</p></td></tr><tr><td><p>2</p></td><td><p>480</p></td></tr><tr><td><p>1</p></td><td><p>300</p></td></tr></tbody></table></section>
