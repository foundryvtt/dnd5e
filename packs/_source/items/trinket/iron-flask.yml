_id: lvLrkAR7k8DS7J3W
name: Iron Flask
type: equipment
img: icons/consumables/drinks/wine-amphora-clay-blue.webp
system:
  description:
    value: >-
      <p><em>Wondrous item</em></p><p>This iron bottle has a brass stopper. You
      can use an action to speak the flask's command word, targeting [[lookup
      @labels.description.affects activity=AgucFlZ6PUt2QPm3]] that you can see
      within [[lookup @labels.description.range activity=AgucFlZ6PUt2QPm3]] of
      you. If the target is native to a plane of existence other than the one
      you're on, the target must succeed on a [[/save
      activity=AgucFlZ6PUt2QPm3]] saving throw or be trapped in the flask. If
      the target has been trapped by the flask before, it has advantage on the
      saving throw. Once trapped, a creature remains in the flask until
      released. The flask can hold only one creature at a time. A creature
      trapped in the flask doesn't need to breathe, eat, or drink and doesn't
      age.</p><p>You can use an action to remove the flask's stopper and release
      the creature the flask contains. The creature is friendly to you and your
      companions for [[lookup @labels.duration activity=UOXpMMzKfELvlWP3]] and
      obeys your commands for that duration. If you give no commands or give it
      a command that is likely to result in its death, it defends itself but
      otherwise takes no actions. At the end of the duration, the creature acts
      in accordance with its normal disposition and alignment.</p><p>An
      @UUID[Compendium.dnd5e.spells.Item.3OZnNhunvRtPOQmH]{identify} spell
      reveals that a creature is inside the flask, but the only way to determine
      the type of creature is to open the flask. A newly discovered bottle might
      already contain a creature chosen by the GM or determined randomly from
      the @UUID[Compendium.dnd5e.tables.RollTable.JDtZNDaAirupdm2O]{Iron Flask}
      table.</p><section id="secret-uh6rCGhQVjUxhYX1"
      class="secret"><p><strong>Foundry Note</strong></p><p>The
      <em><strong>"Release Captured Creature"</strong></em> activity can be
      configured to summon a specific creature by navigating to the Summoning
      Tab, and filling the Summoning Profile with the creature that was
      captured.</p></section>
