system:
  description:
    value: >-
      <p>As an action, you can spread a single bag of caltrops to cover a
      [[lookup @labels.description.template activity=2f6UcqdkFw4dN1Zs]] area.
      Any creature that enters the area must succeed on a [[/save
      activity=vkelR9WJsjV7jrEC]] saving throw or stop moving and take [[/damage
      activity=vkelR9WJsjV7jrEC]] damage. Until the creature regains at least 1
      hit point, its walking speed is reduced by 10 feet. A creature moving
      through the area at half speed doesn't need to make the saving throw.</p>
