_id: M5qkJ7erLqWYUHa0
name: Figurine of Wondrous Power (Obsidian Steed)
type: consumable
img: icons/environment/creatures/horse-brown.webp
system:
  description:
    value: "<p><em>Wondrous item</em></p><p>A\_<em>figurine of wondrous power</em>\_is a statuette of a beast small enough to fit in a pocket. If you use an action to speak the command word and throw the figurine to a point on the ground within [[lookup @labels.description.range activity=0aZay8aIrYkIPxDP]] of you, the figurine becomes a living creature. If the space where the creature would appear is occupied by other creatures or objects, or if there isn't enough space for the creature, the figurine doesn't become a creature.</p><p>The creature is friendly to you and your companions. It understands your languages and obeys your spoken commands. If you issue no commands, the creature defends itself but takes no other actions.</p><p>The creature exists for a duration specific to each figurine. At the end of the duration, the creature reverts to its figurine form. It reverts to a figurine early if it drops to 0 hit points or if you use an action to speak the command word again while touching it. When the creature becomes a figurine again, its property can't be used again until a certain amount of time has passed, as specified in the figurine's description.</p><p><strong>Obsidian Steed</strong>. This polished obsidian horse can become a @UUID[Compendium.dnd5e.monsters.Actor.5SgVGhQBswgWRwsF]{nightmare} for up to [[lookup @labels.duration activity=0aZay8aIrYkIPxDP]]. The nightmare fights only to defend itself. Once it has been used, it can't be used again until 5 days have passed.</p><p>If you have a good alignment, the figurine has a 10 percent chance each time you use it to ignore your orders, including a command to revert to figurine form. If you mount the nightmare while it is ignoring your orders, you and the nightmare are instantly transported to a random location on the plane of Hades, where the nightmare reverts to figurine form.</p>"
