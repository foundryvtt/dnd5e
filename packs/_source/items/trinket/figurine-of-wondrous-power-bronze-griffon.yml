_id: CI58LNiwrTpmWYMp
name: Figurine of Wondrous Power (Bronze Griffon)
type: equipment
img: icons/commodities/bones/hurn-curved-yellow.webp
system:
  description:
    value: >-
      <p><em>Wondrous item</em></p><p>A <em>figurine of wondrous power</em> is a
      statuette of a beast small enough to fit in a pocket. If you use an action
      to speak the command word and throw the figurine to a point on the ground
      within [[lookup @labels.description.range activity=TDXgMH7QJoUpD5oq]] of
      you, the figurine becomes a living creature. If the space where the
      creature would appear is occupied by other creatures or objects, or if
      there isn't enough space for the creature, the figurine doesn't become a
      creature.</p><p>The creature is friendly to you and your companions. It
      understands your languages and obeys your spoken commands. If you issue no
      commands, the creature defends itself but takes no other
      actions.</p><p>The creature exists for a duration specific to each
      figurine. At the end of the duration, the creature reverts to its figurine
      form. It reverts to a figurine early if it drops to 0 hit points or if you
      use an action to speak the command word again while touching it. When the
      creature becomes a figurine again, its property can't be used again until
      a certain amount of time has passed, as specified in the figurine's
      description.</p><p><strong>Bronze Griffon</strong>. This bronze statuette
      is of a griffon rampant. It can become a
      @UUID[Compendium.dnd5e.monsters.Actor.h052EIIUmRwJum65]{Griffon} for up to
      [[lookup @labels.duration activity=TDXgMH7QJoUpD5oq]]. Once it has been
      used, it can't be used again until 5 days have passed.</p>
