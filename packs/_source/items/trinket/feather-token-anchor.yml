name: Feather Token Anchor
type: consumable
img: icons/commodities/materials/feather-blue.webp
system:
  description:
    value: >-
      <p><em>Wondrous item</em></p><p>This tiny object looks like a feather.
      Different types of feather tokens exist, each with a different single-use
      effect. The GM chooses the kind of token or determines it randomly from
      the @UUID[Compendium.dnd5e.tables.RollTable.OEdr086W61t1DRJo]{Feather
      Token} table.</p><p><strong>Anchor.</strong> You can use an action to
      touch the token to a boat or ship. For the next [[lookup @labels.duration
      activity=IECg0pbdpaPL8AYh]], the vessel can't be moved by any means.
      Touching the token to the vessel again ends the effect. When the effect
      ends, the token disappears.</p>
