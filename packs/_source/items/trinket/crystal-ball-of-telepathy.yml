system:
  description:
    value: >-
      <p><em>Wondrous item, (requires attunement)</em></p><p>The crystal ball is
      about 6 inches in diameter. While touching it, you can cast the
      @UUID[Compendium.dnd5e.spells.Item.fVbCxFRaORalHB20]{scrying} spell (save
      DC [[lookup @spell.challenge.save activity=gYpXMExP1crA0hHe]]) with
      it.</p><p>While scrying with the Crystal Ball, you can communicate
      telepathically with creatures you can see within 30 feet of the spell's
      sensor. You can also use an action to cast the
      @UUID[Compendium.dnd5e.spells.Item.zMAWdyc8UVb37BK4]{suggestion} spell
      (save DC [[lookup @spell.challenge.save activity=5OrwGscvIsTh4piO]])
      through the sensor on one of those creatures. You don't need to
      concentrate on this suggestion to maintain it during its duration, but it
      ends if scrying ends.</p><p>Once used, the suggestion power of the Crystal
      Ball can't be used again until the next dawn.</p>
