_id: qXcUKfCVxEvV3VU8
name: Decanter of Endless Water
type: equipment
img: icons/consumables/potions/bottle-round-corked-blue.webp
system:
  description:
    value: >-
      <p><em>Wondrous item</em></p><p>This stoppered flask sloshes when shaken,
      as if it contains water. The decanter weighs 2 pounds.</p><p>You can use
      an action to remove the stopper and speak one of three command words,
      whereupon an amount of fresh water or salt water (your choice) pours out
      of the flask. The water stops pouring out at the start of your next turn.
      Choose from the following options:</p><ul><li><p>"Stream" produces 1
      gallon of water.</p></li><li><p>"Fountain" produces 5 gallons of
      water.</p></li><li><p>"Geyser" produces 30 gallons of water that gushes
      forth in a geyser [[lookup @labels.description.templateSize
      activity=WfgvLw5h2EyjI06T]]. As a bonus action while holding the decanter,
      you can aim the geyser at a creature you can see within [[lookup
      @target.template.size activity=WfgvLw5h2EyjI06T]] feet of you. The target
      must succeed on a [[/save activity=WfgvLw5h2EyjI06T]] saving throw or take
      [[/damage activity=WfgvLw5h2EyjI06T]] damage and fall
      &amp;reference[prone]. Instead of a creature, you can target an object
      that isn't being worn or carried and that weighs no more than 200 pounds.
      The object is either knocked over or pushed up to 15 feet away from
      you.</p></li></ul>
