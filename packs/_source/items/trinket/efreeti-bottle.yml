  description:
    value: >-
      <p><em>Wondrous item</em></p><p>This painted brass bottle weighs 1 pound.
      When you use an action to remove the stopper, a cloud of thick smoke flows
      out of the bottle. At the end of your turn, the smoke disappears with a
      flash of harmless fire, and an
      @UUID[Compendium.dnd5e.monsters.Actor.LTomFUTBrkRi0Pj5]{Efreeti} appears
      in an unoccupied space within 30 feet of you.</p><p>The first time the
      bottle is opened, the GM rolls to determine what happens from the
      @UUID[Compendium.dnd5e.tables.RollTable.yZMFNfocj5qyVuOC]{Efreeti Bottle}
      table.</p>
