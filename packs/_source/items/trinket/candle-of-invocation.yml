_id: ZoUVmRA3HfAK2eZy
name: Candle of Invocation
type: consumable
img: icons/sundries/lights/candle-unlit-yellow.webp
system:
  description:
    value: >-
      <p><em>Wondrous item (requires attunement)</em></p><p>This slender taper
      is dedicated to a deity and shares that deity's alignment. The candle's
      alignment can be detected with the
      @UUID[Compendium.dnd5e.spells.Item.Mzh95utKDPIrjiH8]{detect evil and good}
      spell. The GM chooses the god and associated alignment or determines the
      alignment randomly from the
      @UUID[Compendium.dnd5e.tables.RollTable.C1N8LjO7gOjEWgh4]{Candle of
      Invocation} table.</p><p>The candle's magic is activated when the candle
      is lit, which requires an action. After burning for 4 hours, the candle is
      destroyed. You can snuff it out early for use at a later time. Deduct the
      time it burned in increments of 1 minute from the candle's total burn
      time.</p><p>While lit, the candle sheds &amp;reference[dim light] in a
      30-foot radius. Any creature within that light whose alignment matches
      that of the candle makes attack rolls, saving throws, and ability checks
      with advantage. In addition, a cleric or druid in the light whose
      alignment matches the candle's can cast 1st- level spells he or she has
      prepared without expending spell slots, though the spell's effect is as if
      cast with a 1st-level slot.</p><p>Alternatively, when you light the candle
      for the first time, you can cast the
      <em>@UUID[Compendium.dnd5e.spells.Item.XbwGq5kDJNvAxNXV]{gate} </em>spell
      with it. Doing so destroys the candle.</p>
