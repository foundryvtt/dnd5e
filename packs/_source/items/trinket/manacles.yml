name: Manacles
type: equipment
img: icons/sundries/survival/cuffs-shackles-steel.webp
system:
  description:
    value: >-
      <p>These metal restraints can bind a Small or Medium creature. Escaping
      the manacles requires a successful [[/check activity=8L9SO6Z85M7iXjvX]]
      check. Breaking them requires a successful [[/check
      activity=9DosjAvEYAW0LLK8]] check. Each set of manacles comes with one
      key. Without the key, a creature proficient with thieves' tools can pick
      the manacles' lock with a successful [[/check
      activity=9IBcoj8ChH1OiDT8]]{DC 15 Dexterity} check. Manacles have 15 hit
      points.</p>
