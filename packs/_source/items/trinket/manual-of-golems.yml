_id: UxkP6FvDzPbsIY6o
name: Manual of Golems
type: consumable
img: icons/sundries/books/book-eye-purple.webp
system:
  description:
    value: >-
      <p><em>Wondrous item</em></p><p>This tome contains information and
      incantations necessary to make a particular type of golem. The GM chooses
      the type or determines it randomly from the
      @UUID[Compendium.dnd5e.tables.RollTable.htMPUPPABjI6fwck]{Manual of
      Golems} table. Refer to the table below for a detailed description on each
      golem. To decipher and use the manual, you must be a spellcaster with at
      least two 5th-level spell slots. A creature that can't use a Manual of
      Golems and attempts to read it takes [[/damage activity=bTlMWXymAGeM5q7l]]
      damage.</p><table><thead><tr><th><p>d20</p></th><th><p>Golem</p></th><th><p>Time</p></th><th><p>Cost</p></th></tr></thead><tbody><tr><td><p>1-5</p></td><td><p>@UUID[Compendium.dnd5e.monsters.Actor.YOqhbf8WsX0jH9Fu]{Clay
      Golem}</p></td><td><p>30 days</p></td><td><p>65,000
      gp</p></td></tr><tr><td><p>6-17</p></td><td><p>@UUID[Compendium.dnd5e.monsters.Actor.Hm4o2FgPZsdbXjLq]{Flesh
      Golem}</p></td><td><p>60 days</p></td><td><p>50,000
      gp</p></td></tr><tr><td><p>18</p></td><td><p>@UUID[Compendium.dnd5e.monsters.Actor.h98AuPfomEPcCibP]{Iron
      Golem}</p></td><td><p>120 days</p></td><td><p>100,000
      gp</p></td></tr><tr><td><p>19-20</p></td><td><p>@UUID[Compendium.dnd5e.monsters.Actor.z3gSIXHHWYaHjfBT]{Stone
      Golem}</p></td><td><p>90 days</p></td><td><p>80,000
      gp</p></td></tr></tbody></table><p>To create a golem, you must spend the
      time shown on the table, working without interruption with the manual at
      hand and resting no more than 8 hours per day. You must also pay the
      specified cost to purchase supplies.</p><p>Once you finish creating the
      golem, the book is consumed in eldritch flames. The golem becomes animate
      when the ashes of the manual are sprinkled on it. It is under your
      control, and it understands and obeys your spoken commands.</p>
