_id: GP2bvHlxVi30OEmo
name: Figurine of Wondrous Power (Marble Elephant)
type: consumable
img: icons/commodities/bones/horn-simple-grey.webp
system:
  description:
    value: "<p><em>Wondrous item</em></p><p>A\_<em>figurine of wondrous power</em>\_is a statuette of a beast small enough to fit in a pocket. If you use an action to speak the command word and throw the figurine to a point on the ground within [[lookup @labels.description.range activity=vJJ5LzbufiFqQAxC]] of you, the figurine becomes a living creature. If the space where the creature would appear is occupied by other creatures or objects, or if there isn't enough space for the creature, the figurine doesn't become a creature.</p><p>The creature is friendly to you and your companions. It understands your languages and obeys your spoken commands. If you issue no commands, the creature defends itself but takes no other actions.</p><p>The creature exists for a duration specific to each figurine. At the end of the duration, the creature reverts to its figurine form. It reverts to a figurine early if it drops to 0 hit points or if you use an action to speak the command word again while touching it. When the creature becomes a figurine again, its property can't be used again until a certain amount of time has passed, as specified in the figurine's description.</p><p><strong>Marble Elephant</strong>. This marble statuette is about 4 inches high and long. It can become an @UUID[Compendium.dnd5e.monsters.Actor.jLPhaBnMtAbB5dp1]{elephant} for up to [[lookup @labels.duration activity=vJJ5LzbufiFqQAxC]]. Once it has been used, it can't be used again until 7 days have passed.</p>"
