system:
  description:
    value: >-
      <p><em>Wonderous item</em></p><p>Inside this heavy cloth bag are [[/r 3d4
      #Bag of Beans contents]] dry beans. The bag weighs 1/2 pound plus 1/4
      pound for each bean it contains.</p><p>If you dump the bag's contents out
      on the ground, they explode in a [[lookup @labels.description.range
      activity=uMJvV0SFUzlNKf9C]], extending from the beans. Each creature in
      the area, including you, must make a [[/save activity=uMJvV0SFUzlNKf9C]]
      saving throw, taking [[/damage activity=uMJvV0SFUzlNKf9C]] damage on a
      failed save, or half as much damage on a successful one. The fire ignites
      flammable objects in the area that aren't being worn or carried.</p><p>If
      you remove a bean from the bag, plant it in dirt or sand, and then water
      it, the bean produces an effect [[lookup @labels.duration
      activity=N6TtWYqA9l63g6WV]] later from the ground where it was planted.
      The GM can choose an effect from the
      @UUID[Compendium.dnd5e.tables.RollTable.4ryVFV5LPHPzRKxl]{Bag of Beans}
      table, determine it randomly, or create an
      effect.</p><p>@Embed[Compendium.dnd5e.tables.RollTable.4ryVFV5LPHPzRKxl
      rollable inline]</p>
