    value: >-
      <p><em>Wondrous item</em></p><p>This book contains guidelines for
      influencing and charming others, and its words are charged with magic. If
      you spend [[lookup @labels.activation activity=YXAVbkZO13C8u9n8]] over a
      period of 6 days or fewer studying the book's contents and practicing its
      guidelines, your Charisma score increases by 2, as does your maximum for
      that score. The manual then loses its magic, but regains it in a
      century.</p>
