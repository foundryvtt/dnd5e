_id: thkvJ5QBRORIwkkV
name: Gem of Brightness
type: consumable
img: icons/commodities/gems/gem-faceted-octagon-yellow.webp
system:
  description:
    value: >-
      <p><em>Wondrous item</em></p><p>This prism has [[lookup @item.uses.max]]
      charges. While you are holding it, you can use an action to speak one of
      three command words to cause one of the following
      effects:</p><ul><li><p>The first command word causes the gem to shed
      &amp;reference[bright light] in a 30-foot radius and &amp;reference[dim
      light] for an additional 30 feet. This effect doesn't expend a charge. It
      lasts until you use a bonus action to repeat the command word or until you
      use another function of the gem.</p></li><li><p>The second command word
      expends 1 charge and causes the gem to fire a brilliant beam of light at
      one creature you can see within 60 feet of you. The creature must succeed
      on a [[/save activity=qxTttN25gRLILy3S]] saving throw or become
      &amp;reference[blinded] for [[lookup @labels.duration
      activity=qxTttN25gRLILy3S]]. The creature can repeat the saving throw at
      the end of each of its turns, ending the effect on itself on a
      success.</p></li><li><p>The third command word expends 5 charges and
      causes the gem to flare with blinding light in a [[lookup
      @labels.description.template activity=lva1aiZHj8wKyArF]] originating from
      it. Each creature in the cone must make a saving throw as if struck by the
      beam created with the second command word.</p></li></ul><p>When all of the
      gem's charges are expended, the gem becomes a nonmagical jewel worth 50
      gp.</p>
