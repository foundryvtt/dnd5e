_id: s4fR8bxQGSt4wbH7
name: Cube of Force
type: consumable
img: icons/commodities/treasure/puzzle-cube.webp
system:
  description:
    value: >-
      <p><em>Wondrous item (requires attunement)</em></p><p>This cube is about
      an inch across. Each face has a distinct marking on it that can be
      pressed. The cube starts with [[lookup @item.uses.max]] charges, and it
      regains 1d20 expended charges daily at dawn.</p><p>You can use an action
      to press one of the cube's faces, expending a number of charges based on
      the chosen face, as shown in the Cube of Force Faces table. Each face has
      a different effect. If the cube has insufficient charges remaining,
      nothing happens. Otherwise, a barrier of invisible force springs into
      existence, forming a cube 15 feet on a side. The barrier is centered on
      you, moves with you, and lasts for [[lookup @labels.duration
      activity=zV6C96h22veQI2Zo]], until you use an action to press the cube's
      sixth face, or the cube runs out of charges. You can change the barrier's
      effect by pressing a different face of the cube and expending the
      requisite number of charges, resetting the duration.</p><p>If your
      movement causes the barrier to come into contact with a solid object that
      can't pass through the cube, you can't move any closer to that object as
      long as the barrier remains.</p><table><caption><p>Cube of Force
      Faces</p></caption><thead><tr><th><p>Face</p></th><th><p>Charges</p></th><th><p>Effect</p></th></tr></thead><tbody
      style="text-align:center"><tr><td><p>1</p></td><td><p>1</p></td><td><p>Gases,
      wind, and fog can't pass through the
      barrier.</p></td></tr><tr><td><p>2</p></td><td><p>2</p></td><td><p>Nonliving
      matter can't pass through the barrier. Walls, floors, and ceilings can
      pass through at your
      discretion.</p></td></tr><tr><td><p>3</p></td><td><p>3</p></td><td><p>Living
      matter can't pass through the
      barrier.</p></td></tr><tr><td><p>4</p></td><td><p>4</p></td><td><p>Spell
      effects can't pass through the
      barrier.</p></td></tr><tr><td><p>5</p></td><td><p>5</p></td><td><p>Nothing
      can pass through the barrier. Walls, floors, and ceilings can pass through
      at your
      discretion.</p></td></tr><tr><td><p>6</p></td><td><p>0</p></td><td><p>The
      barrier deactivates.</p></td></tr></tbody></table><p>The cube loses
      charges when the barrier is targeted by certain spells or comes into
      contact with certain spell or magic item effects, as shown in the table
      below.</p><table><thead><tr><th><p>Spell or Item</p></th><th><p>Charges
      Lost</p></th></tr></thead><tbody
      style="text-align:center"><tr><td><p>@UUID[Compendium.dnd5e.spells.Item.HBHbOGKNVVprSlwn]{disintegrate}</p></td><td><p>1d12</p></td></tr><tr><td><p>@UUID[Compendium.dnd5e.items.Item.t7GfyRp3dB3lqS9i]{horn
      of
      blasting}</p></td><td><p>1d10</p></td></tr><tr><td><p>@UUID[Compendium.dnd5e.spells.Item.d9MwcXi7Il3HROXd]{passwall}</p></td><td><p>1d6</p></td></tr><tr><td><p>@UUID[Compendium.dnd5e.spells.Item.eGMhwmuleAM46C6L]{prismatic
      spray}</p></td><td><p>1d20</p></td></tr><tr><td><p>@UUID[Compendium.dnd5e.spells.Item.X3DrXgxjwI2dvkD6]{wall
      of fire}</p></td><td><p>1d4</p></td></tr></tbody></table>
