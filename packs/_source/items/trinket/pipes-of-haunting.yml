_id: oNLfJNRQgUHpU8c7
name: Pipes of Haunting
type: equipment
img: icons/tools/instruments/flute-simple-wood.webp
system:
  description:
    value: >-
      <p><em>Wondrous item</em></p><p>You must be proficient with wind
      instruments to use these pipes. They have [[lookup @item.uses.max]]
      charges. You can use an action to play them and expend 1 charge to create
      an eerie, spellbinding tune. Each creature within [[lookup
      @labels.description.range activity=XmF0TUzoaFDcdOwM]] of you that hears
      you play must succeed on a [[/save activity=XmF0TUzoaFDcdOwM]] saving
      throw or become &amp;reference[frightened] of you for [[lookup
      @labels.duration activity=XmF0TUzoaFDcdOwM]]. If you wish, all creatures
      in the area that aren't hostile toward you automatically succeed on the
      saving throw. A creature that fails the saving throw can repeat it at the
      end of each of its turns, ending the effect on itself on a success. A
      creature that succeeds on its saving throw is immune to the effect of
      these pipes for 24 hours.</p><p>The pipes regain 1d3 expended charges
      daily at dawn.</p>
