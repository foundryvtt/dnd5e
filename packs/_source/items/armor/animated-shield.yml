system:
  description:
    value: >-
      <p><em>Armor (requires attunement)</em></p><p>While holding this shield,
      you can speak its command word as a bonus action to cause it to animate.
      The shield leaps into the air and hovers in your space to protect you as
      if you were wielding it, leaving your hands free. The shield remains
      animated for [[lookup @labels.duration activity=66XL8miWx4CzKR3V]], until
      you use a bonus action to end this effect, or until you are
      &amp;reference[incapacitated apply=false] or die, at which point the
      shield falls to the ground or into your hand if you have one free.</p>
