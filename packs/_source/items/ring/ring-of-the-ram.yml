name: Ring of the Ram
type: equipment
img: icons/equipment/finger/ring-bone-horned-spike.webp
system:
  description:
    value: >-
      <p><em>Ring (requires attunement)</em></p><p>This ring has [[lookup
      @item.uses.max]] charges, and it regains [[lookup
      @item.uses.recovery.0.formula]] expended charges daily at dawn. While
      wearing the ring, you can use an action to expend 1 to 3 of its charges to
      attack [[lookup @labels.description.affects activity=zREIi21mwelFnaOK]]
      you can see within [[lookup @labels.description.range
      activity=zREIi21mwelFnaOK]] of you. The ring produces a spectral ram's
      head and makes its attack roll with a +[[lookup @attack.bonus
      activity=zREIi21mwelFnaOK]] bonus. On a hit, for each charge you spend,
      the target takes 2d10 force damage and is pushed 5 feet away from
      you.</p><p>Alternatively, you can expend 1 to 3 of the ring's charges as
      an action to try to break an object you can see within [[lookup
      @labels.description.range activity=rmJ1x2WSFEXZxiGF]] of you that isn't
      being worn or carried. The ring makes a Strength check with a +5 bonus for
      each charge you spend.</p>
