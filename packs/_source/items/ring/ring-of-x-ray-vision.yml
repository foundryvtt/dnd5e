_id: i3njMqHc689GvHDn
name: Ring of X-ray Vision
type: equipment
img: icons/equipment/finger/ring-eye-silver-green.webp
system:
  description:
    value: >-
      <p><em>Ring (requires attunement)</em></p><p>While wearing this ring, you
      can use an action to speak its command word. When you do so, you can see
      into and through solid matter for [[lookup @labels.duration
      activity=u5jd204ZBDiQiE0w]]. This vision has a radius of 30 feet. To you,
      solid objects within that radius appear transparent and don't prevent
      light from passing through them. The vision can penetrate 1 foot of stone,
      1 inch of common metal, or up to 3 feet of wood or dirt. Thicker
      substances block the vision, as does a thin sheet of lead.</p><p>Whenever
      you use the ring again before taking a long rest, you must succeed on a
      [[/save activity=IrvCq2mA108SP7o1]] saving throw or gain one level of
      &amp;reference[exhaustion].</p>
