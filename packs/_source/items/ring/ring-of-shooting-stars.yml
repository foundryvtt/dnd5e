_id: etA2SBgWwduCLgLT
name: Ring of Shooting Stars
type: equipment
img: icons/equipment/finger/ring-cabochon-silver-purple.webp
system:
  description:
    value: >-
      <p><em>Ring (requires attunement outdoors at night)</em></p><p>While
      wearing this ring in &amp;reference[dim light] or
      &amp;reference[darkness], you can cast
      @UUID[Compendium.dnd5e.spells.Item.CAxSzHWizrafT033]{dancing lights} and
      @UUID[Compendium.dnd5e.spells.Item.Bnn9Nzajixvow9xi]{light} from the ring
      at will. Casting either spell from the ring requires an action.</p><p>The
      ring has [[lookup @item.uses.max]] charges for the following other
      properties. The ring regains [[lookup @item.uses.recovery.0.formula]]
      expended charges daily at dawn.</p><p><strong>Faerie Fire</strong>. You
      can expend 1 charge as an action to cast
      @UUID[Compendium.dnd5e.spells.Item.nqBDWkVOfcGZt4YU]{faerie fire} from the
      ring.</p><p><strong>Ball Lightning</strong>. You can expend 2 charges as
      an action to create one to four 3-foot-diameter spheres of lightning. The
      more spheres you create, the less powerful each sphere is
      individually.</p><p>Each sphere appears in an unoccupied space you can see
      within [[lookup @labels.description.range activity=N7wEKzyzJh8KSrty]] of
      you. The spheres last as long as you concentrate (as if concentrating on a
      spell), up to [[lookup @labels.duration activity=N7wEKzyzJh8KSrty]]. Each
      sphere sheds &amp;reference[dim light] in a 30-foot radius.</p><p>As a
      bonus action, you can move each sphere up to 30 feet, but no farther than
      120 feet away from you. When a creature other than you comes within 5 feet
      of a sphere, the sphere discharges lightning at that creature and
      disappears. That creature must make a DC 15 Dexterity saving throw. On a
      failed save, the creature takes lightning damage based on the number of
      spheres you
      created.</p><table><thead><tr><td><p><strong>Spheres</strong></p></td><td><p><strong>Lightning
      Damage</strong></p></td></tr></thead><tbody
      style="text-align:center"><tr><td><p>4</p></td><td><p>2d4</p></td></tr><tr><td><p>3</p></td><td><p>2d6</p></td></tr><tr><td><p>2</p></td><td><p>5d4</p></td></tr><tr><td><p>1</p></td><td><p>4d12</p></td></tr></tbody></table><p><strong>Shooting
      Stars</strong>. You can expend 1 to 3 charges as an action. For every
      charge you expend, you launch a glowing mote of light from the ring at a
      point you can see within [[lookup @labels.description.range
      activity=kIq6FByxplsrVGW5]] of you. Each creature within a [[lookup
      @labels.description.template activity=kIq6FByxplsrVGW5]] originating from
      that point is showered in sparks and must make a DC 15 Dexterity saving
      throw, taking 5d4 fire damage on a failed save, or half as much damage on
      a successful one.</p>
