_id: Zf7kBZa5f4WBepn1
name: Ring of Earth Elemental Command
type: equipment
img: icons/equipment/finger/ring-band-engraved-teal.webp
system:
  description:
    value: >-
      <p><em>Ring (requires attunement)</em></p><p>This ring is linked to the
      Elemental Plane of Earth.</p><p>While wearing this ring, you have
      advantage on attack rolls against
      @UUID[Compendium.dnd5e.monsters.Actor.sApYLZj9PTZ40wJr]{earth elementals},
      and they have disadvantage on attack rolls against you. In addition, you
      have access to properties based on the linked plane.</p><p>The ring has
      [[lookup @item.uses.max]] charges. It regains 1d4 + 1 expended charges
      daily at dawn. Spells cast from the ring have a save DC of
      17.</p><p><strong>Ring of Earth Elemental Command</strong>. You can expend
      2 of the ring's charges to cast
      @UUID[Compendium.dnd5e.spells.Item.eEpy1ONlXumKS1mp]{Dominate Monster} on
      an Earth Elemental. In addition, you can move in &amp;reference[difficult
      terrain] that is composed of rubble, rocks, or dirt as if it were normal
      terrain. You can also speak and understand Terran.</p><p>If you help slay
      an Earth Elemental while attuned to the ring, you gain access to the
      following additional properties:</p><ul><li><p>You have resistance to acid
      damage.</p></li><li><p>You can move through solid earth or rock as if
      those areas were &amp;reference[difficult terrain]. If you end your turn
      there, you are shunted out to the nearest unoccupied space you last
      occupied.</p></li><li><p>You can cast the following spells from the ring,
      expending the necessary number of charges:
      @UUID[Compendium.dnd5e.spells.Item.QvGcdRUSNRKEQJlK]{stone shape} (2
      charges), @UUID[Compendium.dnd5e.spells.Item.ReMbjfeOKoSj3O79]{stoneskin}
      (3 charges), or @UUID[Compendium.dnd5e.spells.Item.NmoRmM1mhuM3pqnY]{wall
      of stone} (3 charges).</p></li></ul>
