_id: 9cIlRtKDtDXQtElf
name: Ring of Spell Storing
type: equipment
img: icons/equipment/finger/ring-cabochon-bronze-green.webp
system:
  description:
    value: >-
      <p><em>Ring (requires attunement)</em></p><p>This ring stores spells cast
      into it, holding them until the attuned wearer uses them. The ring can
      store up to 5 levels worth of spells at a time. When found, it contains
      [[/r 1d6−1 #Levels of stored spells when this ring is found.]] levels of
      stored spells chosen by the GM.</p><p>Any creature can cast a spell of 1st
      through 5th level into the ring by touching the ring as the spell is cast.
      The spell has no effect, other than to be stored in the ring. If the ring
      can't hold the spell, the spell is expended without effect. The level of
      the slot used to cast the spell determines how much space it
      uses.</p><p>While wearing this ring, you can cast any spell stored in it.
      The spell uses the slot level, spell save DC, spell attack bonus, and
      spellcasting ability of the original caster, but is otherwise treated as
      if you cast the spell. The spell cast from the ring is no longer stored in
      it, freeing up space.</p><section id="secret-WferqZXbAuOuwtC7"
      class="secret"><p><strong>Foundry Note</strong></p><p>This ring has
      several Cast activities that you can use to hold spells (a total of five
      to represent five levels worth of spells stored). When you wish to store a
      spell in this ring, open up one of the Cast activities, navigate to the
      "Spell" tab, and drop the spell into it's space. You can then enter in the
      original caster's Attack Bonus and Save DC for the spell stored within the
      ring.</p></section>
