system:
  description:
    value: >-
      <p>You can summon a nature spirit that assumes an animal form to aid you.
      As a &amp;Reference[Magic] action, you can expend a spell slot or a use of
      Wild Shape to cast the
      <em>@UUID[Compendium.dnd-players-handbook.spells.Item.phbsplFindFamili]{Find
      Familiar}</em> spell without Material components.</p><p>When you cast the
      spell in this way, the familiar is Fey and disappears when you finish a
      Long Rest.</p>
