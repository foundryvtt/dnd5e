system:
  description:
    value: >-
      <p><em>A Nature Priest of Primal Power</em></p><h3>Core Druid
      Traits</h3><table class="core-class-traits"><tbody><tr><th
      scope="row"><p><strong>Primary
      Ability</strong></p></th><td><p>Wisdom</p></td></tr><tr><th
      scope="row"><p><strong>Hit Point Die</strong></p></th><td><p>D8 per Druid
      level</p></td></tr><tr><th scope="row"><p><strong>Saving Throw
      Proficiencies</strong></p></th><td><p>Intelligence and
      Wisdom</p></td></tr><tr><th scope="row"><p><strong>Skill
      Proficiencies</strong></p></th><td><p><em>Choose 2:</em> Animal Handling,
      Arcana, Insight, Medicine, Nature, Perception, Religion, or
      Survival</p></td></tr><tr><th scope="row"><p><strong>Weapon
      Proficiencies</strong></p></th><td><p>Simple weapons</p></td></tr><tr><th
      scope="row"><p><strong>Tool
      Proficiencies</strong></p></th><td><p>Herbalism Kit</p></td></tr><tr><th
      scope="row"><p><strong>Armor Training</strong></p></th><td><p>Light armor
      and Shields</p></td></tr><tr><th scope="row"><p><strong>Starting
      Equipment</strong></p></th><td><p><em>Choose A or B:</em> (A)
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbarmLeatherArm]{Leather
      Armor},
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbarmShield0000]{Shield},
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbwepSickle0000]{Sickle},
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbagDruidicFocu]{Druidic
      Focus}
      (@UUID[Compendium.dnd-players-handbook.equipment.Item.phbwepQuartersta]{Quarterstaff}),
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbagExplorersPa]{Explorer's
      Pack},
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbtulHerbalismK]{Herbalism
      Kit}, and [[/award 9GP]]; or (B) [[/award
      50GP]]</p></td></tr></tbody></table><p>Druids belong to ancient orders
      that call on the forces of nature. Harnessing the magic of animals,
      plants, and the four elements, Druids heal, transform into animals, and
      wield elemental destruction.</p><p>Revering nature above all, individual
      Druids gain their magic from nature, a nature deity, or both, and they
      typically unite with other Druids to perform rites that mark the passage
      of the seasons and other natural cycles.</p><p>Druids are concerned with
      the delicate ecological balance that sustains plant and animal life and
      with the need for people to live in harmony with nature. Druids often
      guard sacred sites or watch over regions of unspoiled nature, but when a
      significant danger arises, Druids take a more active role as adventurers
      who combat the threat.</p><h2>Becoming a Druid …</h2><h3>As a Level 1
      Character</h3><ul><li><p>Gain all the traits in the Core Druid Traits
      table.</p></li><li><p>Gain the Druid's level 1 features, which are listed
      in the Druid Features table.</p></li></ul><h3>As a Multiclass
      Character</h3><ul><li><p>Gain the following traits from the Core Druid
      Traits table: Hit Point Die and training with Light armor and
      Shields.</p></li><li><p>Gain the Druid's level 1 features, which are
      listed in the Druid Features table. See the multiclassing rules in chapter
      2 to determine your available spell slots.</p></li></ul>
