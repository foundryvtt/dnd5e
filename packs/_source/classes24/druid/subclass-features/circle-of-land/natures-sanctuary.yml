        chatFlavor: ''
        value: >-
          <p>As a &amp;Reference[Magic] action, you can expend a use of your
          Wild Shape and cause spectral trees and vines to appear in a 15-foot
          Cube on the ground within 120 feet of yourself. They last there for 1
          minute or until you have the &amp;Reference[Incapacitated apply=false]
          condition or die. You and your allies have &amp;Reference[Half Cover]
          while in that area, and your allies gain the current
          &amp;Reference[Resistance] of your Nature's Ward while there.</p>
