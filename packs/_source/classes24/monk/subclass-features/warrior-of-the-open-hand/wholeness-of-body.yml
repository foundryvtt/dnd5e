  description:
    value: >-
      <p>You gain the ability to heal yourself. As a Bonus Action, you can roll
      your Martial Arts die. You regain a number of Hit Points equal to the
      number rolled plus your Wisdom modifier (minimum of 1 Hit Point
      regained).</p><p>You can use this feature a number of times equal to your
      Wisdom modifier (minimum of once), and you regain all expended uses when
      you finish a Long Rest.</p>
