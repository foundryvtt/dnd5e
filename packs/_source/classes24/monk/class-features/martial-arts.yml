system:
  description:
    value: >-
      <p>Your practice of martial arts gives you mastery of combat styles that
      use your Unarmed Strike and Monk weapons, which are the
      following:</p><ul><li><p>Simple Melee weapons</p></li><li><p>Martial Melee
      weapons that have the Light property</p></li></ul><p>You gain the
      following benefits while you are unarmed or wielding only Monk weapons and
      you aren't wearing armor or wielding a Shield.</p><p><em><strong>Bonus
      Unarmed Strike.</strong></em> You can make an Unarmed Strike as a Bonus
      Action.</p><p><em><strong>Martial Arts Die.</strong></em> You can roll 1d6
      in place of the normal damage of your Unarmed Strike or Monk weapons. This
      die changes as you gain Monk levels, as shown in the Martial Arts column
      of the Monk Features table.</p><p><em><strong>Dexterous
      Attacks.</strong></em><strong> </strong>You can use your Dexterity
      modifier instead of your Strength modifier for the attack and damage rolls
      of your Unarmed Strikes and Monk weapons. In addition, when you use the
      Grapple or Shove option of your Unarmed Strike, you can use your Dexterity
      modifier instead of your Strength modifier to determine the save DC.</p>
