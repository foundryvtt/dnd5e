    value: >-
      <p>At the start of your turn, you can expend 3 Focus Points to bolster
      yourself against harm for 1 minute or until you have the Incapacitated
      condition. During that time, you have Resistance to all damage except
      Force damage.</p><section id="secret-jojCvqn1dDjsyTzI"
      class="secret"><p><strong>Foundry Note</strong></p><p>This feature will
      expend 3 Focus Points and includes an Active Effect which will apply the
      relevant Resistances.</p></section>
