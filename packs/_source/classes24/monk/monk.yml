      class="hide-in-embed"><em>@UUID[Compendium.dnd5e.content24.JournalEntry.phbMonk000000000]{Class
      Details}</em></p><h3>Becoming a Monk …</h3><h4>As a Level 1
      Character</h4><ul><li><p>Gain all the traits in the Core Monk Traits
      table.</p></li><li><p>Gain the Monk's level 1 features, which are listed
      in the Monk Features table.</p></li></ul><h4>As a Multiclass
      Character</h4><ul><li><p>Gain the Hit Point Die trait from the Core Monk
      Traits table.</p></li><li><p>Gain the Monk's level 1 features, which are
      listed in the Monk Features table.</p></li></ul>
