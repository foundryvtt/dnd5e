system:
  description:
    value: >-
      <p><em>A Martial Artist of Supernatural Focus</em></p><h3>Core Monk
      Traits</h3><table class="core-class-traits"><tbody><tr><th
      scope="row"><p>Primary Ability</p></th><td><p>Dexterity and
      Wisdom</p></td></tr><tr><th scope="row"><p>Hit Point Die</p></th><td><p>D8
      per Monk level</p></td></tr><tr><th scope="row"><p>Saving Throw
      Proficiencies</p></th><td><p>Strength and Dexterity</p></td></tr><tr><th
      scope="row"><p>Skill Proficiencies</p></th><td><p><em>Choose 2:</em>
      Acrobatics, Athletics, History, Insight, Religion, or
      Stealth</p></td></tr><tr><th scope="row"><p>Weapon
      Proficiencies</p></th><td><p>Simple weapons and Martial weapons that have
      the Light property</p></td></tr><tr><th scope="row"><p>Tool
      Proficiencies</p></th><td><p><em>Choose one type of Artisan's Tools or
      Musical Instrument</em></p></td></tr><tr><th scope="row"><p>Armor
      Training</p></th><td><p>None</p></td></tr><tr><th scope="row"><p>Starting
      Equipment</p></th><td><p><em>Choose A or B:</em> (A)
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbwepSpear00000]{Spear},
      5
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbwepDagger0000]{Daggers},
      Artisan's Tools or Musical Instrument chosen for the tool proficiency
      above,
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbagExplorersPa]{Explorer's
      Pack}, and [[/award 11GP]]; or (B) [[/award
      50GP]]</p></td></tr></tbody></table><p>Monks use rigorous combat training
      and mental discipline to align themselves with the multiverse and focus
      their internal reservoirs of power. Different Monks conceptualize this
      power in various ways: as breath, energy, life force, essence, or self,
      for example. Whether channeled as a striking display of martial prowess or
      as a subtler manifestation of defense and speed, this power infuses all
      that a Monk does.</p><p>Monks focus their internal power to create
      extraordinary, even supernatural, effects. They channel uncanny speed and
      strength into their attacks, with or without the use of weapons. In a
      Monk's hands, even the most basic weapons can become sophisticated
      implements of combat mastery.</p><p>Many Monks find that a structured life
      of ascetic withdrawal helps them cultivate the physical and mental focus
      they need to harness their power. Other Monks believe that immersing
      themselves in the vibrant confusion of life helps to fuel their
      determination and discipline.</p><p>Monks generally view adventures as
      tests of their physical and mental development. They are driven by a
      desire to accomplish a greater mission than merely slaying monsters and
      plundering treasure; they strive to turn themselves into living
      weapons.</p><h2>Becoming a Monk …</h2><h3>As a Level 1
      Character</h3><ul><li><p>Gain all the traits in the Core Monk Traits
      table.</p></li><li><p>Gain the Monk's level 1 features, which are listed
      in the Monk Features table.</p></li></ul><h3>As a Multiclass
      Character</h3><ul><li><p>Gain the Hit Point Die trait from the Core Monk
      Traits table.</p></li><li><p>Gain the Monk's level 1 features, which are
      listed in the Monk Features table.</p></li></ul>
