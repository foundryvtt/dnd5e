  description:
    value: >-
      <p>You can nimbly dodge out of the way of certain dangers. When you're
      subjected to an effect that allows you to make a Dexterity saving throw to
      take only half damage, you instead take no damage if you succeed on the
      saving throw and only half damage if you fail. You can't use this feature
      if you have the &amp;Reference[Incapacitated apply=false] condition.</p>
