_id: phbrgeCunningStr
name: Cunning Strike
type: feat
folder: ymTkGscp5QEOwDlv
img: icons/skills/melee/blade-tip-acid-poison-green.webp
system:
  description:
    value: >-
      <p>You've developed cunning ways to use your Sneak Attack. When you deal
      Sneak Attack damage, you can add one of the following Cunning Strike
      effects. Each effect has a die cost, which is the number of Sneak Attack
      damage dice you must forgo to add the effect. You remove the die before
      rolling, and the effect occurs immediately after the attack's damage is
      dealt. For example, if you add the Poison effect, remove 1d6 from the
      Sneak Attack's damage before rolling.</p><p>If a Cunning Strike effect
      requires a saving throw, the DC equals 8 plus your Dexterity modifier and
      Proficiency
      Bonus.</p><p>@Embed[Compendium.dnd5e.classes24.Item.phbrgeCunningStr.Activity.n64fvJMT9fPUy7DH
      caption=false cite=false nameStyle=inline]{Poison (Cost:
      1d6)}</p><p>@Embed[Compendium.dnd5e.classes24.Item.phbrgeCunningStr.Activity.dWcCw1vTWRMx4YzD
      caption=false cite=false nameStyle=inline]{Trip (Cost:
      1d6)}</p><p>@Embed[Compendium.dnd5e.classes24.Item.phbrgeCunningStr.Activity.m2bRZ1YeD3yf9nV7
      caption=false cite=false nameStyle=inline]{Withdraw (Cost:
      1d6)}</p><section id="secret-kCs7nMVrTvJRlkCy"
      class="secret"><p><strong>Foundry Note</strong></p><p>After using Cunning
      Strike effects use the <strong>Cunning Sneak Attack</strong> activity on
      the Sneak Attack feature. It will prompt you to select how many dice you
      expended on effects and deduct them from your Sneak Attack roll
      automatically.</p></section>
