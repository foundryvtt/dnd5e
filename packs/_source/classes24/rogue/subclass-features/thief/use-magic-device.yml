        value: >-
          <p>You can use any <em>Spell Scroll,</em> using Intelligence as your
          spellcasting ability for the spell. If the spell is a cantrip or a
          level 1 spell, you can cast it reliably. If the scroll contains a
          higher-level spell, you must first succeed on an Intelligence (Arcana)
          check (DC 10 plus the spell’s level). On a successful check, you cast
          the spell from the scroll. On a failed check, the scroll
          disintegrates.</p>
