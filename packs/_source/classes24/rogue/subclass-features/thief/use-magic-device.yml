  description:
    value: >-
      <p>You've learned how to maximize use of magic items, granting you the
      following benefits.</p><p><em><strong>Attunement.</strong></em> You can
      attune to up to four magic items at
      once.</p><p><em><strong>Charges.</strong></em> Whenever you use a magic
      item property that expends charges, roll [[/r 1d6]]. On a roll of 6, you
      use the property without expending the
      charges.</p><p>@Embed[Compendium.dnd5e.classes24.Item.phbrgeUseMagicDe.Activity.mrK57dSVtwgDGh3F
      caption=false cite=false nameStyle=inline]{Scrolls}</p><section
      id="secret-2tHTpsolDU6Nggvo" class="secret"><p><strong>Foundry
      Note</strong></p><p>When using an item property that expends charges roll
      the d6 and uncheck the consumption box to use it for free.</p></section>
