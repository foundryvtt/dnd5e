name: Rogue
type: class
folder: JBKpeqLQWPp9Wt59
img: systems/dnd5e/icons/classes/rogue.webp
system:
  description:
    value: >-
      <p><em>A Dexterous Expert in Stealth and Subterfuge</em></p><h3>Core Rogue
      Traits</h3><table class="core-class-traits"><tbody><tr><th
      scope="row"><p>Primary
      Ability</p></th><td><p>Dexterity</p></td></tr><tr><th scope="row"><p>Hit
      Point Die</p></th><td><p>D8 per Rogue level</p></td></tr><tr><th
      scope="row"><p>Saving Throw Proficiencies</p></th><td><p>Dexterity and
      Intelligence</p></td></tr><tr><th scope="row"><p>Skill
      Proficiencies</p></th><td><p><em>Choose 4: </em>Acrobatics, Athletics,
      Deception, Insight, Intimidation, Investigation, Perception, Persuasion,
      Sleight of Hand, or Stealth</p></td></tr><tr><th scope="row"><p>Weapon
      Proficiencies</p></th><td><p>Simple weapons and Martial weapons that have
      the Finesse or Light property</p></td></tr><tr><th scope="row"><p>Tool
      Proficiencies</p></th><td><p>Thieves' Tools</p></td></tr><tr><th
      scope="row"><p>Armor Training</p></th><td><p>Light
      armor</p></td></tr><tr><th scope="row"><p>Starting
      Equipment</p></th><td><p><em>Choose A or B:</em> (A)
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbarmLeatherArm]{Leather
      Armor}, 2
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbwepDagger0000]{Daggers},
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbwepShortsword]{Short­sword},
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbwepShortbow00]{Shortbow},
      20
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbamoArrows0000]{Arrows},
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbagQuiver00000]{Quiver},
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbtulThievesToo]{Thieves'
      Tools},
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbagBurglarsPac]{Burglar's
      Pack}, and [[/award 8GP]]; or (B) [[/award
      100GP]]</p></td></tr></tbody></table><p>Rogues rely on cunning, stealth,
      and their foes' vulnerabilities to get the upper hand in any situation.
      They have a knack for finding the solution to just about any problem. A
      few even learn magical tricks to supplement their other abilities. Many
      Rogues focus on stealth and deception, while others refine skills that
      help them in a dungeon environment, such as climbing, finding and
      disarming traps, and opening locks.</p><p>In combat, Rogues prioritize
      subtle strikes over brute strength. They would rather make one precise
      strike than wear an opponent down with a barrage of blows.</p><p>Some
      Rogues began their careers as criminals, while others used their cunning
      to fight crime. Whatever a Rogue's relation to the law, no common criminal
      or officer of the law can match the subtle brilliance of the greatest
      Rogues.</p><h2>Becoming a Rogue …</h2><h3>As a Level 1
      Character</h3><ul><li><p>Gain all the traits in the Core Rogue Traits
      table.</p></li><li><p>Gain the Rogue's level 1 features, which are listed
      in the Rogue Features table.</p></li></ul><h3>As a Multiclass
      Character</h3><ul><li><p>Gain the following traits from the Core Rogue
      Traits table: Hit Point Die, proficiency in one skill of your choice from
      the Rogue's skill list, proficiency with Thieves' Tools, and training with
      Light armor.</p></li><li><p>Gain the Rogue's level 1 features, which are
      listed in the
      @UUID[Compendium.dnd5e.content24.JournalEntry.phbRogue00000000.JournalEntryPage.gJV8iDqdNhRMLi5r#class-features]{Rogue
      Features table}.</p></li></ul>
