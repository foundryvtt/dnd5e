  description:
    value: >-
      <p>@Embed[Compendium.dnd5e.content24.JournalEntry.phbAppendixClass.JournalEntryPage.phbrgeRogue00000
      inline classes="free-rules-embed"]</p><p
      class="hide-in-embed"><em>@UUID[Compendium.dnd5e.content24.JournalEntry.phbRogue00000000]{Class
      Details}</em></p><h3>Becoming a Rogue …</h3><h4>As a Level 1
      Character</h4><ul><li><p>Gain all the traits in the Core Rogue Traits
      table.</p></li><li><p>Gain the Rogue's level 1 features, which are listed
      in the Rogue Features table.</p></li></ul><h4>As a Multiclass
      Character</h4><ul><li><p>Gain the following traits from the Core Rogue
      Traits table: Hit Point Die, proficiency in one skill of your choice from
      the Rogue's skill list, proficiency with Thieves' Tools, and training with
      Light armor.</p></li><li><p>Gain the Rogue's level 1 features, which are
      listed in the Rogue Features table.</p></li></ul>
