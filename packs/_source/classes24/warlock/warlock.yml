    value: >-
      <p>@Embed[Compendium.dnd5e.content24.JournalEntry.phbAppendixClass.JournalEntryPage.phbwlkWarlock000
      inline classes="free-rules-embed"]</p><p
      class="hide-in-embed"><em>@UUID[Compendium.dnd5e.content24.JournalEntry.phbWarlock000000]{Class
      Details}</em></p><h3>Becoming a Warlock …</h3><h4>As a Level 1
      Character</h4><ul><li><p>Gain all the traits in the Core Warlock Traits
      table.</p></li><li><p>Gain the Warlock's level 1 features, which are
      listed in the Warlock Features table.</p></li></ul><h4>As a Multiclass
      Character</h4><ul><li><p>Gain the following traits from the Core Warlock
      Traits table: Hit Point Die and training with Light
      armor.</p></li><li><p>Gain the Warlock's level 1 features, which are
      listed in the Warlock Features table. See the
      @UUID[Compendium.dnd5e.content24.JournalEntry.phbCreatingAChar.JournalEntryPage.vcs4jfEKRxPCsgXm]{multiclassing
      rules} to determine your available spell slots.</p></li></ul>
