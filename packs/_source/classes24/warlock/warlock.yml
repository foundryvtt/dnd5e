system:
  description:
    value: >-
      <p><em>An Occultist Empowered by Otherworldly Pacts</em></p><h3>Core
      Warlock Traits</h3><table class="core-class-traits"><tbody><tr><th
      scope="row"><p>Primary
      Ability</p></th><td><p>Charisma</p></td></tr><tr><th scope="row"><p>Hit
      Point Die</p></th><td><p>D8 per Warlock level</p></td></tr><tr><th
      scope="row"><p>Saving Throw Proficiencies</p></th><td><p>Wisdom and
      Charisma</p></td></tr><tr><th scope="row"><p>Skill
      Proficiencies</p></th><td><p><em>Choose 2: </em>Arcana, Deception,
      History, Intimidation, Investigation, Nature, or
      Religion</p></td></tr><tr><th scope="row"><p>Weapon
      Proficiencies</p></th><td><p>Simple weapons</p></td></tr><tr><th
      scope="row"><p>Armor Training</p></th><td><p>Light
      armor</p></td></tr><tr><th scope="row"><p>Starting
      Equipment</p></th><td><p><em>Choose A or B: </em>(A)
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbarmLeatherArm]{Leather
      Armor},
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbwepSickle0000]{Sickle},
      2
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbwepDagger0000]{Daggers},
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbagArcaneFocus]{Arcane
      Focus}
      (@UUID[Compendium.dnd-players-handbook.equipment.Item.phbafcOrb0000000]{orb}),
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phiPN9UzkXk3i5xh]{Book}
      (occult lore),
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbagScholarsPac]{Scholar's
      Pack}, and [[/award 15GP]]; or (B) [[/award
      100GP]]</p></td></tr></tbody></table><p>Warlocks quest for knowledge that
      lies hidden in the fabric of the multiverse. They often begin their search
      for magical power by delving into tomes of forbidden lore, dabbling in
      invocations meant to attract the power of extraplanar beings, or seeking
      places of power where the influence of these beings can be felt. In no
      time, each Warlock is drawn into a binding pact with a powerful patron.
      Drawing on the ancient knowledge of beings such as angels, archfey,
      demons, devils, hags, and alien entities of the Far Realm, Warlocks piece
      together arcane secrets to bolster their own power.</p><p>Warlocks view
      their patrons as resources, as means to the end of achieving magical
      power. Some Warlocks respect, revere, or even love their patrons; some
      serve their patrons grudgingly; and some seek to undermine their patrons
      even as they wield the power their patrons have given them.</p><p>Once a
      pact is made, a Warlock's thirst for knowledge and power can't be slaked
      with mere study. Most Warlocks spend their days pursuing greater power and
      deeper knowledge, which typically means some kind of
      adventure.</p><h2>Becoming a Warlock …</h2><h3>As a Level 1
      Character</h3><ul><li><p>Gain all the traits in the Core Warlock Traits
      table.</p></li><li><p>Gain the Warlock's level 1 features, which are
      listed in the
      @UUID[Compendium.dnd5e.content24.JournalEntry.phbWarlock000000.JournalEntryPage.znue6EaGDDXgeQb0#class-features]{Warlock
      Features table}.</p></li></ul><h3>As a Multiclass
      Character</h3><ul><li><p>Gain the following traits from the Core Warlock
      Traits table: Hit Point Die and training with Light
      armor.</p></li><li><p>Gain the Warlock's level 1 features, which are
      listed in the Warlock Features table. See the
      @UUID[Compendium.dnd5e.content24.JournalEntry.phbCreatingAChar.JournalEntryPage.vcs4jfEKRxPCsgXm]{multiclassing
      rules} to determine your available spell slots.</p></li></ul>
