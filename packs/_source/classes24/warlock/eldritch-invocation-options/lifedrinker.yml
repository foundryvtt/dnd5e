system:
  description:
    value: >-
      <div class="item-entry-details"><p class="item-entry-tag">Prerequisite:
      Level 9+ Warlock,
      @UUID[Compendium.dnd5e.classes24.Item.phbinvPactBlade0]{Pact of the Blade}
      Invocation</p></div><p>Once per turn when you hit a creature with your
      pact weapon, you can deal an extra 1d6 Necrotic, Psychic, or Radiant
      damage (your choice) to the creature, and you can expend one of your Hit
      Point Dice to roll it and regain a number of Hit Points equal to the roll
      plus your Constitution modifier (minimum of 1 Hit Point).</p>
