  description:
    value: >-
      <blockquote><p>Prerequisite: Level 2+ Warlock, a Warlock Cantrip That
      Deals Damage via an Attack Roll</p></blockquote><p>Choose one of your
      known Warlock cantrips that requires an attack roll. When you hit a Large
      or smaller creature with that cantrip, you can push the creature up to 10
      feet straight away from you.</p><p><strong>Repeatable.</strong> You can
      gain this invocation more than once. Each time you do so, choose a
      different eligible cantrip.</p><section class="secret"
      id="secret-5xV7SaKI7sGaeKvq"><p><strong>Foundry Note</strong></p><p>The
      <strong>Make Repelling</strong> activity can be used to enchant a cantrip
      which adds ", Repelling" as a reminder.</p></section>
