system:
  description:
    value: >-
      <div class="item-entry-details"><p class="item-entry-tag">Prerequisite:
      Level 5+ Warlock,
      @UUID[Compendium.dnd5e.classes24.Item.phbinvPactChain0]{Pact of the Chain}
      Invocation</p></div><p>When you cast
      <em>@UUID[Compendium.dnd-players-handbook.spells.Item.phbsplFindFamili]{Find
      Familiar}</em>, you infuse the summoned familiar with a measure of your
      eldritch power, granting the creature the following
      benefits.</p><p><em><strong>Aerial or Aquatic.</strong></em> The familiar
      gains either a Fly Speed or a Swim Speed (your choice) of 40
      feet.</p><p>@Embed[Compendium.dnd5e.classes24.Item.phbinvInvestment.Activity.nVygzzH0AxhOMaxu
      caption=false cite=false nameStyle=inline]</p><p><em><strong>Necrotic or
      Radiant Damage.</strong></em> Whenever the familiar deals Bludgeoning,
      Piercing, or Slashing damage, you can make it deal Necrotic or Radiant
      damage instead.</p><p><em><strong>Your Save DC.</strong></em> If the
      familiar forces a creature to make a saving throw, it uses your spell save
      DC.</p><p>@Embed[Compendium.dnd5e.classes24.Item.phbinvInvestment.Activity.fHEY2QcPTBaT4lBF
      caption=false cite=false nameStyle=inline]</p><section
      id="secret-D3vSCo0uEG4Kp1X6" class="secret"><p><strong>Foundry
      Note</strong></p><p>The <strong>Find Familiar</strong> activities will
      apply both <strong>Aerial</strong> and <strong>Aquatic</strong> effects to
      the summoned creature. The unused effect on the creature may be
      deleted.</p><p>The <strong>Resistance</strong> activity includes optional
      Active Effect for resisting each type of damage.</p></section>
