  description:
    value: >-
      <p>You learn the
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplFindFamili]{Find
      Familiar} spell and can cast it as a Magic action without expending a
      spell slot.</p><p>When you cast the spell, you choose one of the normal
      forms for your familiar or one of the following special forms:
      @UUID[Compendium.dnd-players-handbook.actors.Actor.phbmobImp0000000]{Imp},
      @UUID[Compendium.dnd-players-handbook.actors.Actor.phbmobPseudodrag]{Pseudodragon},
      @UUID[Compendium.dnd-players-handbook.actors.Actor.phbmobQuasit0000]{Quasit},
      @UUID[Compendium.dnd-players-handbook.actors.Actor.phbmobSkeleton00]{Skeleton},
      @UUID[Compendium.dnd-players-handbook.actors.Actor.phbmobSlaadTadpo]{Slaad
      Tadpole},
      @UUID[Compendium.dnd-players-handbook.actors.Actor.phbmobSphinxofWo]{Sphinx
      of Wonder},
      @UUID[Compendium.dnd-players-handbook.actors.Actor.phbmobSprite0000]{Sprite},
      or
      @UUID[Compendium.dnd-players-handbook.actors.Actor.phbmobVenomousSn]{Venomous
      Snake}.</p><p>Additionally, when you take the Attack action, you can forgo
      one of your own attacks to allow your familiar to make one attack of its
      own with its Reaction.</p><section id="secret-aKbhLPfPD3R9Y1KL"
      class="secret"><p><strong>Foundry Note</strong></p><p>The <strong>Summon
      Familiar</strong> activity includes the normal summoning options and the
      <strong>Summon Familiar (Expanded Options)</strong> activity includes the
      additional options.</p></section>
