  description:
    value: >-
      <div class="item-entry-details"><p class="item-entry-tag">Prerequisite:
      Level 2+ Warlock, a Warlock Cantrip That Deals Damage</p></div><p>Choose
      one of your known Warlock cantrips that deals damage and has a range of
      10+ feet. When you cast that spell, its range increases by a number of
      feet equal to 30 times your Warlock
      level.</p><p><em><strong>Repeatable.</strong></em> You can gain this
      invocation more than once. Each time you do so, choose a different
      eligible cantrip.</p><section id="secret-7hr3xIfya7IOq7pj"
      class="secret"><p><strong>Foundry Note</strong></p><p>Use the
      <strong>Increase Range</strong> enchantment activity and drag your chosen
      cantrip to the chat card to increase its range and append "(Eldritch
      Spear)" for easier identification.</p></section>
