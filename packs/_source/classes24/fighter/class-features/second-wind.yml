system:
  description:
    value: >-
      <p>You have a limited well of physical and mental stamina that you can
      draw on. As a Bonus Action, you can use it to regain Hit Points equal to
      1d10 plus your Fighter level.</p><p>You can use this feature twice. You
      regain one expended use when you finish a Short Rest, and you regain all
      expended uses when you finish a Long Rest.</p><p>When you reach certain
      Fighter levels, you gain more uses of this feature, as shown in the Second
      Wind column of the
      @UUID[Compendium.dnd5e.content24.JournalEntry.phbFighter000000.JournalEntryPage.wDELe3k25FQvYdrq#class-features]{Fighter
      Features} table.</p>
