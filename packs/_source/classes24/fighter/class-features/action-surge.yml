    value: >-
      <p>You can push yourself beyond your normal limits for a moment. On your
      turn, you can take one additional action, except the Magic
      action.</p><p>Once you use this feature, you can't do so again until you
      finish a Short or Long Rest. Starting at level 17, you can use it twice
      before a rest but only once on a turn.</p><section
      id="secret-nYOY8k3V38g8mZIS" class="secret"><p><strong>Foundry
      Note</strong></p><p>This feature includes a limited use that increases
      automatically at level 17.</p></section>
