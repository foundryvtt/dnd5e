system:
  description:
    value: >-
      <p>You attain the pinnacle of resilience in battle, giving you these
      benefits.</p><p><strong>Defy Death.</strong> You have Advantage on Death
      Saving Throws. Moreover, when you roll 18–20 on a Death Saving Throw, you
      gain the benefit of rolling a 20 on it.</p><p><strong>Heroic
      Rally.</strong> At the start of each of your turns, you regain Hit Points
      equal to 5 plus your Constitution modifier if you are Bloodied and have at
      least 1 Hit Point.</p><section class="secret"
      id="secret-z1Nr871ifr67hchm"><p><strong>Foundry Note</strong></p><p>This
      feature does not automate the Death Saving Throw changes to rolling an 18
      or 19, but does include Advantage automation. It includes an activity for
      healing but does not automatically add it when you are
      Bloodied.</p></section>
