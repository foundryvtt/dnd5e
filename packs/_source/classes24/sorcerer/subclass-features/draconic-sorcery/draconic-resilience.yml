      Your Hit Point maximum increases by 3, and it increases by 1 whenever you
      gain another Sorcerer level.</p><p>Parts of you are also covered by
      dragon-like scales. While you aren't wearing armor, your base Armor Class
      equals 10 plus your Dexterity and Charisma modifiers.</p>
