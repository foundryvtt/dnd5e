system:
  description:
    value: >-
      <p>The magic in your body manifests physical traits of your draconic gift.
      Your Hit Point maximum increases by 3, and it increases by 1 whenever you
      gain another Sorcerer level.</p><p>Parts of you are also covered by
      dragon-like scales. While you aren't wearing armor, your base Armor Class
      equals 10 plus your Dexterity and Charisma modifiers.</p><section
      class="secret" id="secret-uBlQVhOqmjWWiLc4"><p><strong>Foundry
      Note</strong></p><p>This feature includes an Active Effect that
      automatically increases your Hit Point maximum and sets up your Unarmored
      Defense which can be disabled if you would prefer to use
      armor.</p></section>
