      without a spell slot, and you regain the ability to cast it in this way
      when you finish a Long Rest.</p><p>Whenever you start casting the spell,
      you can modify it so that it doesn't require Concentration. If you do so,
      the spell's duration becomes 1 minute for that casting.</p>
