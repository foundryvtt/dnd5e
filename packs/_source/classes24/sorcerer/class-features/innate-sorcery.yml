system:
  description:
    value: >-
      <p>An event in your past left an indelible mark on you, infusing you with
      simmering magic. As a Bonus Action, you can unleash that magic for 1
      minute, during which you gain the following benefits:</p><ul><li><p>The
      spell save DC of your Sorcerer spells increases by 1.</p></li><li><p>You
      have Advantage on the attack rolls of Sorcerer spells you
      cast.</p></li></ul><p>You can use this feature twice, and you regain all
      expended uses of it when you finish a Long Rest.</p>
