system:
  description:
    value: >-
      <p>You can tap into the wellspring of magic within yourself. This
      wellspring is represented by Sorcery Points, which allow you to create a
      variety of magical effects.</p><p>You have 2 Sorcery Points, and you gain
      more as you reach higher levels, as shown in the Sorcery Points column of
      the Sorcerer Features table. You can't have more Sorcery Points than the
      number shown in the table for your level. You regain all expended Sorcery
      Points when you finish a Long Rest.</p><p>You can use your Sorcery Points
      to fuel the options below, along with other features, such as Metamagic,
      that use those
      points.</p><p>@Embed[Compendium.dnd5e.classes24.Item.phbscrFontOfMagi.Activity.qAphJay1yKd7VWxH
      caption=false cite=false nameStyle=inline]{Converting Spell Slots to
      Sorcery
      Points}</p><p>@Embed[Compendium.dnd5e.classes24.Item.phbscrFontOfMagi.Activity.rYDgagyWjp6f3jtO
      caption=false cite=false nameStyle=inline]{Creating Spell
      Slots}</p><table><caption><p>Creating Spell
      Slots</p></caption><thead><tr><th><p>Spell Slot
      Level</p></th><th><p>Sorcery Point Cost</p></th><th><p>Min. Sorcerer
      Level</p></th></tr></thead><tbody><tr><td><p>1</p></td><td><p>2</p></td><td><p>2</p></td></tr><tr><td><p>2</p></td><td><p>3</p></td><td><p>3</p></td></tr><tr><td><p>3</p></td><td><p>5</p></td><td><p>5</p></td></tr><tr><td><p>4</p></td><td><p>6</p></td><td><p>7</p></td></tr><tr><td><p>5</p></td><td><p>7</p></td><td><p>9</p></td></tr></tbody></table>
