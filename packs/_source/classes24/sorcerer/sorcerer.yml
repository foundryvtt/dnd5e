      inline classes="free-rules-embed"]</p><p
      class="hide-in-embed"><em>@UUID[Compendium.dnd5e.content24.JournalEntry.phbSorcerer00000]{Class
      Details}</em></p><h3>Becoming a Sorcerer …</h3><h4>As a Level 1
      Character</h4><ul><li><p>Gain all the traits in the Core Sorcerer Traits
      table.</p></li><li><p>Gain the Sorcerer's level 1 features, which are
      listed in the Sorcerer Features table.</p></li></ul><h4>As a Multiclass
      Character</h4><ul><li><p>Gain the Hit Point Die from the Core Sorcerer
      Traits table.</p></li><li><p>Gain the Sorcerer's level 1 features, which
      are listed in the Sorcerer Features table. See the
      @UUID[Compendium.dnd5e.content24.JournalEntry.phbCreatingAChar.JournalEntryPage.vcs4jfEKRxPCsgXm]{multiclassing
      rules} to determine your available spell slots.</p></li></ul>
