_id: phbbrbPersistent
name: Persistent Rage
type: feat
img: icons/skills/social/intimidation-impressing.webp
system:
  description:
    value: >-
      <p>When you roll Initiative, you can regain all expended uses of Rage.
      After you regain uses of Rage in this way, you can't do so again until you
      finish a Long Rest.</p><p>In addition, your Rage is so fierce that it now
      lasts for 10 minutes without you needing to do anything to extend it from
      round to round. Your Rage ends early if you have the
      &amp;Reference[Unconscious apply=false] condition (not just the
      &amp;Reference[Incapacitated apply=false] condition) or don Heavy
      armor.</p>
