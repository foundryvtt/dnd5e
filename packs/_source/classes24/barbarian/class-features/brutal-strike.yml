      one Strength-based attack roll of your choice on your turn. The chosen
      attack roll mustn't have Disadvantage. If the chosen attack roll hits, the
      target takes an extra [[lookup @scale.brutal-strike.damage]]{1d10} damage
      of the same type dealt by the weapon or Unarmed Strike, and you can cause
      one Brutal Strike effect of your choice. You have the following effect
