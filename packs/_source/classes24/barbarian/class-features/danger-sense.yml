system:
  description:
    value: >-
      <p>You gain an uncanny sense of when things aren't as they should be,
      giving you an edge when you dodge perils. You have Advantage on Dexterity
      saving throws unless you have the &amp;Reference[Incapacitated]
      condition.</p><section id="secret-gIJELszWrIqRFCxF"
      class="secret"><p><strong>Foundry Note</strong></p><p>This feature
      automates the Advantage on Dexterity saving throws but is not
      automatically disabled when Incapacitated. It can be temporarily
      deactivated in the Effects tab.</p></section>
