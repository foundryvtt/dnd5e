name: Weapon Mastery
type: feat
img: icons/skills/melee/weapons-crossed-swords-yellow-teal.webp
system:
  description:
    value: >-
      <p>Your training with weapons allows you to use the mastery properties of
      two kinds of Simple or Martial Melee weapons of your choice, such as
      Greataxes and Handaxes. Whenever you finish a Long Rest, you can practice
      weapon drills and change one of those weapon choices.</p><p>When you reach
      certain Barbarian levels, you gain the ability to use the mastery
      properties of more kinds of weapons, as shown in the Weapon Mastery column
      of the Barbarian Features table.</p>
