    value: >-
      <p>@Embed[Compendium.dnd5e.content24.JournalEntry.phbAppendixClass.JournalEntryPage.phbbrbBarbarian0
      inline classes="free-rules-embed"]</p><p
      class="hide-in-embed"><em>@UUID[Compendium.dnd5e.content24.JournalEntry.phbBarbarian0000]{Class
      Details}</em></p><h3>Becoming a Barbarian …</h3><h4>As a Level 1
      Character</h4><ul><li><p>Gain all the traits in the Core Barbarian Traits
      table.</p></li><li><p>Gain the Barbarian's level 1 features, which are
      listed in the Barbarian Features table.</p></li></ul><h4>As a Multiclass
      Character</h4><ul><li><p>Gain the following traits from the Core Barbarian
      Traits table: Hit Point Die, proficiency with Martial weapons, and
      training with Shields.</p></li><li><p>Gain the Barbarian's level 1
      features, which are listed in the Barbarian Features table.</p></li></ul>
