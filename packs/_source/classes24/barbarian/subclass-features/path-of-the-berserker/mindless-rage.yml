  description:
    value: >-
      <p>You have Immunity to the &amp;Reference[Charmed apply=false] and
      &amp;Reference[Frightened apply=false] conditions while your Rage is
      active. If you're Charmed or Frightened when you enter your Rage, the
      condition ends on you.</p><section id="secret-CnCRD0Dyvx4FFGfV"
      class="secret"><p><strong>Foundry Note</strong></p><p>This feature
      includes an Active Effect which grants the Charmed and Frightened
      condition immunity. It is not applied automatically when you begin your
      Rage though.</p></section>
