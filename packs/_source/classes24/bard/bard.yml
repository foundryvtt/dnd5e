img: systems/dnd5e/icons/classes/bard.webp
system:
  description:
    value: >-
      <p><em>An Inspiring Performer of Music, Dance, and Magic</em></p><h3>Core
      Bard Traits</h3><table
      class="core-class-traits"><tbody><tr><th><p><strong>Primary
      Ability</strong></p></th><td><p>Charisma</p></td></tr><tr><th><p><strong>Hit
      Point Die</strong></p></th><td><p>D8 per Bard
      level</p></td></tr><tr><th><p><strong>Saving Throw
      Proficiencies</strong></p></th><td><p>Dexterity and
      Charisma</p></td></tr><tr><th><p><strong>Skill
      Proficiencies</strong></p></th><td><p><em>Choose any 3
      skills</em></p></td></tr><tr><th><p><strong>Weapon
      Proficiencies</strong></p></th><td><p>Simple
      weapons</p></td></tr><tr><th><p><strong>Tool
      Proficiencies</strong></p></th><td><p><em>Choose 3 Musical
      Instruments</em></p></td></tr><tr><th><p><strong>Armor
      Training</strong></p></th><td><p>Light
      armor</p></td></tr><tr><th><p><strong>Starting
      Equipment</strong></p></th><td><p><em>Choose A or B:</em> (A)
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbarmLeatherArm]{Leather
      Armor}, 2
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbwepDagger0000]{Daggers},
      Musical Instrument of your choice,
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbagEntertainer]{Entertainer's
      Pack}, and [[/award 19gp]]; or (B) [[/award
      90GP]]</p></td></tr></tbody></table><p><strong>Invoking magic through
      music, dance,</strong> and verse, Bards are expert at inspiring others,
      soothing hurts, disheartening foes, and creating illusions. Bards believe
      the multiverse was spoken into existence and that remnants of its Words of
      Creation still resound and glimmer on every plane of existence. Bardic
      magic attempts to harness those words, which transcend any
      language.</p><p>Anything can inspire a new song or tale, so Bards are
      fascinated by almost everything. They become masters of many things,
      including performing music, working magic, and making jests.</p><p>A
      Bard's life is spent traveling, gathering lore, telling stories, and
      living on the gratitude of audiences, much like any other entertainer. But
      Bards' depth of knowledge and mastery of magic sets them apart.</p><aside
      class="notable"><h3>A Bard's Repertoire</h3><p>Does your Bard beat a drum
      while chanting the deeds of ancient heroes? Strum a lute while crooning
      romantic tunes? Perform arias of stirring power? Recite dramatic
      monologues from classic tragedies? Use the rhythm of a folk dance to
      coordinate the movement of allies in battle? Compose naughty
      limericks?</p><p>When you play a Bard, consider the style of artistic
      performance you favor, the moods you might invoke, and the themes that
      inspire your own creations. Are your poems inspired by moments of natural
      beauty, or are they brooding reflections on loss? Do you prefer lofty
      hymns or rowdy tavern songs? Are you drawn to laments for the fallen or
      celebrations of joy? Do you dance merry jigs or perform elaborate
      interpretive choreography? Do you focus on one style of performance or
      strive to master them all?</p></aside><h2>Becoming a Bard …</h2><h3>As a
      Level 1 Character</h3><ul><li><p>Gain all the traits in the Core Bard
      Traits table.</p></li><li><p>Gain the Bard's level 1 features, which are
      listed in the Bard Features table.</p></li></ul><h3>As a Multiclass
      Character</h3><ul><li><p>Gain the following traits from the Core Bard
      Traits table: Hit Point Die, proficiency in one skill of your choice,
      proficiency with one Musical Instrument of your choice, and training with
      Light armor.</p></li><li><p>Gain the Bard's level 1 features, which are
      listed in the Bard Features table. See the multiclassing rules in chapter
      2 to determine your available spell slots.</p></li></ul>
