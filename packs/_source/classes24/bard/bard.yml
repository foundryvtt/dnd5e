  description:
    value: >-
      <p>@Embed[Compendium.dnd5e.content24.JournalEntry.phbAppendixClass.JournalEntryPage.phbbrdBard000000
      inline classes="free-rules-embed"]</p><p
      class="hide-in-embed"><em>@UUID[Compendium.dnd5e.content24.JournalEntry.phbBard000000000]{Class
      Details}</em></p><h3>Becoming a Bard …</h3><h4>As a Level 1
      Character</h4><ul><li><p>Gain all the traits in the Core Bard Traits
      table.</p></li><li><p>Gain the Bard's level 1 features, which are listed
      in the Bard Features table.</p></li></ul><h4>As a Multiclass
      Character</h4><ul><li><p>Gain the following traits from the Core Bard
      Traits table: Hit Point Die, proficiency in one skill of your choice,
      proficiency with one Musical Instrument of your choice, and training with
      Light armor.</p></li><li><p>Gain the Bard's level 1 features, which are
      listed in the Bard Features table. See the multiclassing rules in chapter
      2 to determine your available spell slots.</p></li></ul>
