system:
  description:
    value: >-
      <p>You've learned secrets from various magical traditions. Whenever you
      reach a Bard level (including this level) and the Prepared Spells number
      in the Bard Features table increases, you can choose any of your new
      prepared spells from the
      @UUID[Compendium.dnd5e.content24.JournalEntry.phbSpells0000000.JournalEntryPage.wwia6Wwo4BgE9GSI]{Bard},
      @UUID[Compendium.dnd5e.content24.JournalEntry.phbSpells0000000.JournalEntryPage.SkHptN2PTzFGDaEj]{Cleric},
      @UUID[Compendium.dnd5e.content24.JournalEntry.phbSpells0000000.JournalEntryPage.LhvuDQEyrCdg5EfU]{Druid},
      and
      @UUID[Compendium.dnd5e.content24.JournalEntry.phbSpells0000000.JournalEntryPage.6AnqLUowgdsqMFvz]{Wizard}
      spell lists, and the chosen spells count as Bard spells for you. In
      addition, whenever you replace a spell prepared for this class, you can
      replace it with a spell from those lists.</p>
