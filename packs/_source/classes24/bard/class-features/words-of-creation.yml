  description:
    value: >-
      <p>You have mastered two of the Words of Creation: the words of life and
      death. You therefore always have the
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplPowerWordH]{Power
      Word Heal} and
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplPowerWordK]{Power
      Word Kill} spells prepared. When you cast either spell, you can target a
      second creature with it if that creature is within 10 feet of the first
      target.</p><section id="secret-aHHp3ZnTrWPHHB7j"
      class="secret"><p><strong>Foundry Note</strong></p><p>You are
      automatically granted these spells as you level up.</p></section>
