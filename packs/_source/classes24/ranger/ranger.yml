  description:
    value: >-
      <p>@Embed[Compendium.dnd5e.content24.JournalEntry.phbAppendixClass.JournalEntryPage.phbrgrRanger0000
      inline classes="free-rules-embed"]</p><p
      class="hide-in-embed"><em>@UUID[Compendium.dnd5e.content24.JournalEntry.phbRanger0000000]{Class
      Details}</em></p><h3>Becoming a Ranger …</h3><h4>As a Level 1
      Character</h4><ul><li><p>Gain all the traits in the Core Ranger Traits
      table.</p></li><li><p>Gain the Ranger's level 1 features, which are listed
      in the Ranger Features table.</p></li></ul><h4>As a Multiclass
      Character</h4><ul><li><p>Gain the following traits from the Core Ranger
      Traits table: Hit Point Die, proficiency with Martial weapons, proficiency
      in one skill of your choice from the Ranger's skill list, and training
      with Light and Medium armor and Shields.</p></li><li><p>Gain the Ranger's
      level 1 features, which are listed in the Ranger Features table. See the
      multiclassing rules in chapter 2 to determine your available spell
      slots.</p></li></ul>
