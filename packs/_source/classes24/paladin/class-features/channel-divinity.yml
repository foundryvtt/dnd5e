        value: >-
          <p>As a Bonus Action, you can open your awareness to detect
          Celestials, Fiends, and Undead. For the next 10 minutes or until you
          have the &amp;Reference[Incapacitated apply=false] condition, you know
          the location of any creature of those types within 60 feet of
          yourself, and you know its creature type. Within the same radius, you
          also detect the presence of any place or object that has been
          consecrated or desecrated, as with the
          @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplHallow0000]{Hallow}
