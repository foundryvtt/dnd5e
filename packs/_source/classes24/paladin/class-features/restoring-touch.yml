system:
  description:
    value: >-
      <p>When you use Lay On Hands on a creature, you can also remove one or
      more of the following conditions from the creature: &amp;Reference[Blinded
      apply=false], &amp;Reference[Charmed apply=false], &amp;Reference[Deafened
      apply=false], &amp;Reference[Frightened apply=false],
      &amp;Reference[Paralyzed apply=false], or &amp;Reference[Stunned
      apply=false]. You must expend 5 Hit Points from the healing pool of Lay On
      Hands for each of these conditions you remove; those points don't also
      restore Hit Points to the creature.</p><section
      id="secret-jxD0l6XyrF6DQqyI" class="secret"><p><strong>Foundry
      Note</strong></p><p>This feature includes a Scale prompt for selecting how
      many conditions you would like to remove that will automatically consume
      the correct number from your Lay on Hands pool.</p></section>
