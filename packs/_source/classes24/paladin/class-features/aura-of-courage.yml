system:
  description:
    value: >-
      <p>You and your allies have Immunity to the Frightened condition while in
      your Aura of Protection. If a Frightened ally enters the aura, that
      condition has no effect on that ally while there.</p><section
      id="secret-equ8xnC2DFxkcJAn" class="secret"><p><strong>Foundry
      Note</strong></p><p>This feature includes an Active Effect for tracking
      who is within your aura but it is not automatically added/removed nor does
      it remove the Frightened condition.</p></section>
