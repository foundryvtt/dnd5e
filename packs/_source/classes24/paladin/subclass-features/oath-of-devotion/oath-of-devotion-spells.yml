      of
      Truth}</p></td></tr><tr><td><p>9</p></td><td><p>@UUID[Compendium.dnd-players-handbook.spells.Item.phbsplBeaconofHo]{Beacon
      of Hope},
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplDispelMagi]{Dispel
      Magic}</p></td></tr><tr><td><p>13</p></td><td><p>@UUID[Compendium.dnd-players-handbook.spells.Item.phbsplFreedomofM]{Freedom
      of Movement},
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplGuardianof]{Guardian
      of
      Faith}</p></td></tr><tr><td><p>17</p></td><td><p>@UUID[Compendium.dnd-players-handbook.spells.Item.phbsplCommune000]{Commune},
