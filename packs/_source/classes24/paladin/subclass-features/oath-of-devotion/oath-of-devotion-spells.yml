      from Evil and Good},
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplShieldofFa]{Shield
      of
      Faith}</p></td></tr><tr><td><p>5</p></td><td><p>@UUID[Compendium.dnd-players-handbook.spells.Item.phbsplAid0000000]{Aid},
