system:
  description:
    value: >-
      <p>Whenever you use Turn Undead, you can roll a number of d8s equal to
      your Wisdom modifier (minimum of 1d8, currently [[lookup
      @abilities.wis.mod]]) and add the rolls together. Each Undead that fails
      its saving throw against that use of Turn Undead takes Radiant damage
      equal to the roll's total. This damage doesn't end the turn
      effect.</p><section class="secret"
      id="secret-VJPPRFTlu1fFg8XB"><p><strong>Foundry Note</strong></p><p>This
      feature can be used in place of Turn Undead. It consumes a use of Channel
      Divinity, includes the Save, Active Effects for the conditions, and this
      feature's damage roll.</p></section>
