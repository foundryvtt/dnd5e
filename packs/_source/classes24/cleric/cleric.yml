    value: >-
      <p>@Embed[Compendium.dnd5e.content24.JournalEntry.phbAppendixClass.JournalEntryPage.phbclcCleric0000
      inline classes="free-rules-embed"]</p><p
      class="hide-in-embed"><em>@UUID[Compendium.dnd5e.content24.JournalEntry.phbCleric0000000]{Class
      Details}</em></p><h3>Becoming a Cleric …</h3><h4>As a Level 1
      Character</h4><ul><li><p>Gain all the traits in the Core Cleric Traits
      table.</p></li><li><p>Gain the Cleric's level 1 features, which are listed
      in the Cleric Features table.</p></li></ul><h4>As a Multiclass
      Character</h4><ul><li><p>Gain the following traits from the Core Cleric
      Traits table: Hit Point Die and training with Light and Medium armor and
      Shields.</p></li><li><p>Gain the Cleric's level 1 features, which are
      listed in the Cleric Features table. See the multiclassing rules in
      chapter 2 to determine your available spell slots.</p></li></ul>
