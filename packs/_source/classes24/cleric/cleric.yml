system:
  description:
    value: >-
      <p><em>A Miraculous Priest of Divine Power</em></p><h3>Core Cleric
      Traits</h3><table class="core-class-traits"><tbody><tr><th
      scope="row"><p>Primary Ability</p></th><td><p>Wisdom</p></td></tr><tr><th
      scope="row"><p>Hit Point Die</p></th><td><p>D8 per Cleric
      level</p></td></tr><tr><th scope="row"><p>Saving Throw
      Proficiencies</p></th><td><p>Wisdom and Charisma</p></td></tr><tr><th
      scope="row"><p>Skill Proficiencies</p></th><td><p><em>Choose 2:
      </em>History, Insight, Medicine, Persuasion, or
      Religion</p></td></tr><tr><th scope="row"><p>Weapon
      Proficiencies</p></th><td><p>Simple weapons</p></td></tr><tr><th
      scope="row"><p>Armor Training</p></th><td><p>Light and Medium armor and
      Shields</p></td></tr><tr><th scope="row"><p>Starting
      Equipment</p></th><td><p><em>Choose A or B:</em> (A)
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbarmChainShirt]{Chain
      Shirt},
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbarmShield0000]{Shield},
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbwepMace000000]{Mace},
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbagHolySymbolV]{Holy
      Symbol},
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbagPriestsPack]{Priest's
      Pack}, and [[/award 7GP]]; or (B) [[/award
      110GP]]</p></td></tr></tbody></table><p>Clerics draw power from the realms
      of the gods and harness it to work miracles. Blessed by a deity, a
      pantheon, or another immortal entity, a Cleric can reach out to the divine
      magic of the Outer Planes—where gods dwell—and channel it to bolster
      people and battle foes.</p><p>Because their power is a divine gift,
      Clerics typically associate themselves with temples dedicated to the deity
      or other immortal force that unlocked their magic. Harnessing divine magic
      doesn't rely on specific training, yet Clerics might learn prayers and
      rites that help them draw on power from the Outer Planes.</p><p>Not every
      member of a temple or shrine is a Cleric. Some priests are called to a
      simple life of temple service, carrying out their devotion through prayer
      and rituals, not through magic. Many mortals claim to speak for the gods,
      but few can marshal the power of those gods the way a Cleric
      can.</p><h2>Becoming a Cleric …</h2><h3>As a Level 1
      Character</h3><ul><li><p>Gain all the traits in the Core Cleric Traits
      table.</p></li><li><p>Gain the Cleric's level 1 features, which are listed
      in the Cleric Features table.</p></li></ul><h3>As a Multiclass
      Character</h3><ul><li><p>Gain the following traits from the Core Cleric
      Traits table: Hit Point Die and training with Light and Medium armor and
      Shields.</p></li><li><p>Gain the Cleric's level 1 features, which are
      listed in the Cleric Features table. See the multiclassing rules in
      chapter 2 to determine your available spell slots.</p></li></ul>
