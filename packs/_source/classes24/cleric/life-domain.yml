system:
  description:
    value: >-
      <p><em>Soothe the Hurts of the World</em></p><p>The Life Domain focuses on
      the positive energy that helps sustain all life in the multiverse. Clerics
      who tap into this domain are masters of healing, using that life force to
      cure many hurts.</p><p>Existence itself relies on the positive energy
      associated with this domain, so a Cleric of almost any religious tradition
      might choose it. This domain is particularly associated with agricultural
      deities, gods of healing or endurance, and gods of home and community.
      Religious orders of healing also seek the magic of this domain.</p><p
      class="hide-in-embed"><em>@UUID[Compendium.dnd5e.content24.JournalEntry.phbCleric0000000.JournalEntryPage.aGYpgynZ3nkBCPaT]{Subclass
      Details}</em></p>
