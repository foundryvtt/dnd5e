system:
  description:
    value: >-
      <p>As a &amp;Reference[Magic] action, you present your Holy Symbol and
      expend a use of your Channel Divinity to evoke healing energy that can
      restore a number of Hit Points equal to five times your Cleric level.
      Choose &amp;Reference[Bloodied] creatures within 30 feet of yourself
      (which can include you), and divide those Hit Points among them. This
      feature can restore a creature to no more than half its Hit Point
      maximum.</p><section id="secret-vybBdwcDQO3jMVDo"
      class="secret"><p><strong>Foundry Note</strong></p><p>The
      <strong>Heal</strong> activity does not automatically restrict the HP
      gained to 50% of the target's max.</p></section>
