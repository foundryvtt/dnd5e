  - name: Detect Evil and Good
    system:
      description:
        value: >-
          <p>For the duration, you sense the location of any Aberration,
          Celestial, Elemental, Fey, Fiend, or Undead within 30 feet of
          yourself. You also sense whether the
          <em>@UUID[Compendium.dnd5e.spells24.Item.phbsplHallow0000]{Hallow}</em>
          spell is active there and, if so, where.</p><p>The spell is blocked by
          1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of
          lead.</p>
