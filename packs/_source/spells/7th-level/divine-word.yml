name: Divine Word
ownership:
  default: 0
type: spell
system:
  description:
    value: >-
      <p>You utter a divine word, imbued with the power that shaped the world at
      the dawn of Creation. Choose any number of creatures you can see within
      range. Each creature that can hear you must make a Charisma saving throw.
      On a failed save, a creature suffers an effect based on its current hit
      points:</p><ul><li><p>50 Hit Points or fewer: &amp;reference[Deafened
      apply=false] for 1 minute</p></li><li><p>40 Hit Points or fewer:
      &amp;reference[Deafened apply=false] and &amp;reference[Blinded
      apply=false] for 10 minutes</p></li><li><p>30 Hit Points or fewer:
      &amp;reference[Blinded apply=false], &amp;reference[Deafened apply=false],
      and &amp;reference[Stunned apply=false] for 1 Hour</p></li><li><p>20 Hit
      Points or fewer: killed instantly</p></li></ul><p>Regardless of its
      current hit points, a celestial, an elemental, a fey, or a fiend that
      fails its save is forced back to its plane of origin (if it isn't there
      already) and can't return to your current plane for 24 hours by any means
      short of a @UUID[Compendium.dnd5e.spells.Item.3okM6Gn63zzEULkz]{wish}
      spell.</p>
