  description:
    value: >-
      <p>A creature you touch becomes &amp;reference[invisible apply=false]
      until the spell ends. Anything the target is wearing or carrying is
      invisible as long as it is on the target's person. The spell ends for a
      target that attacks or casts a spell.</p><p><strong>At Higher
      Levels.</strong> When you cast this spell using a spell slot of 3rd level
      or higher, you can target one additional creature for each slot level
