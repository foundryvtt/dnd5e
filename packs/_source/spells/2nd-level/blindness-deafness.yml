name: Blindness/Deafness
ownership:
  default: 0
type: spell
system:
  description:
    value: >-
      <p>You can blind or deafen a foe. Choose one creature that you can see
      within range to make a Constitution saving throw. If it fails, the target
      is either &amp;Reference[blinded] or &amp;Reference[deafened] (your
      choice) for the duration. At the end of each of its turns, the target can
      make a Constitution saving throw. On a success, the spell
      ends.</p><p><strong>At Higher Levels.</strong> When you cast this spell
      using a spell slot of 3rd level or higher, you can target one additional
      creature for each slot level above 2nd.</p>
