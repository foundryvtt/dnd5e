name: Protection from Poison
ownership:
  default: 0
type: spell
system:
  description:
    value: >-
      <p>You touch a creature. If it is poisoned, you neutralize the poison. If
      more than one poison afflicts the target, you neutralize one poison that
      you know is present, or you neutralize one at random.</p><p>For the
      duration, the target has advantage on saving throws against being
      &amp;Reference[poisoned apply=false], and it has resistance to poison
      damage.</p>
