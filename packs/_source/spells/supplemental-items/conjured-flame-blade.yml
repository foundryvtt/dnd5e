  description:
    value: >-
      <p>Created by the
      @UUID[Compendium.dnd5e.spells.Item.Advtckpz1B733bu9]{Flame Blade}
      spell.</p><p>The blade is similar in size and shape to a Scimitar, and it
      lasts for the Duration. If you let go of the blade, it disappears, but you
      can evoke the blade again as a Bonus Action.</p><p>You can use your action
      to make a melee spell Attack with the fiery blade. On a hit, the target
      takes [[lookup @flags.world.flame-blade-damage]]{3d6} fire
      damage.</p><p>The flaming blade sheds &amp;reference[bright light] in a
      10-foot radius and &amp;reference[dim light] for an additional 10
      feet.</p>
