name: Holy Aura
ownership:
  default: 0
type: spell
system:
  description:
    value: >-
      <p>Divine light washes out from you and coalesces in a soft radiance in a
      30-foot radius around you. Creatures of your choice in that radius when
      you cast this spell shed &amp;reference[dim light] in a 5-foot radius and
      have advantage on all saving throws, and other creatures have disadvantage
      on attack rolls against them until the spell ends. In addition, when a
      fiend or an undead hits an affected creature with a melee attack, the aura
      flashes with brilliant light. The attacker must succeed on a Constitution
      saving throw or be &amp;reference[Blinded] until the spell
      ends.</p><section id="secret-NLJXMDmWrmFI98zM"
      class="secret"><p><strong>Foundry Note</strong></p><p>You can apply the
      @UUID[Compendium.dnd5e.spells.Item.j8S49Rea8b1640Zi.ActiveEffect.vtInaQPPgrwFw8iq]{Bathing
      in Holy Aura} effect to yourself and creatures within range to grant the
      proper bonuse during the spell's duration.</p></section>
