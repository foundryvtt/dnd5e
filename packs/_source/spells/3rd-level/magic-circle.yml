name: Magic Circle
ownership:
  default: 0
type: spell
system:
  description:
    value: >-
      <p>You create a 10-foot-radius, 20-foot-tall Cylinder of magical energy
      centered on a point on the ground that you can see within range. Glowing
      runes appear wherever the cylinder intersects with the floor or other
      surface.</p><p>Choose one or more of the following types of creatures:
      celestials, elementals, fey, fiends, or undead. The circle affects a
      creature of the chosen type in the following ways:</p><ul><li><p>The
      creature can't willingly enter the cylinder by nonmagical means. If the
      creature tries to use teleportation or interplanar travel to do so, it
      must first succeed on a Charisma saving throw.</p></li><li><p>The creature
      has disadvantage on attack rolls against targets within the
      cylinder.</p></li><li><p>Targets within the cylinder can't be
      &amp;reference[Charmed apply=false], &amp;reference[Frightened
      apply=false], or possessed by the creature.</p></li></ul><p>When you cast
      this spell, you can elect to cause its magic to operate in the reverse
      direction, preventing a creature of the specified type from leaving the
      cylinder and protecting targets outside it.</p><p><strong>At Higher
      Levels.</strong> When you cast this spell using a spell slot of 4th level
      or higher, the Duration increases by 1 Hour for each slot level above
      3rd.</p>
