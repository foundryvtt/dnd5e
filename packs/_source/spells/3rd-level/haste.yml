name: Haste
ownership:
  default: 0
type: spell
system:
  description:
    value: >-
      <p>Choose a willing creature that you can see within range. Until the
      spell ends, the target's speed is doubled, it gains a +2 bonus to AC, it
      has advantage on Dexterity Saving Throws, and it gains an additional
      action on each of its turns. That action can be used only to take the
      &amp;reference[Attack] (one weapon attack only), &amp;reference[Dash],
      &amp;reference[Disengage], &amp;reference[Hide], or &amp;reference[Use an
      Object] action.</p><p>When the spell ends, the target can't move or take
      Actions until after its next turn, as a wave of lethargy sweeps over
      it.</p>
