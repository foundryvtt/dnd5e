name: Freedom of Movement
ownership:
  default: 0
type: spell
system:
  description:
    value: >-
      <p>You touch a willing creature. For the Duration, the target's Movement
      is unaffected by &amp;reference[difficult terrain], and Spells and other
      magical Effects can neither reduce the target's speed nor cause the target
      to be &amp;reference[Paralyzed apply=false] or &amp;reference[Restrained
      apply=false].</p><p>The target can also spend 5 feet of Movement to
      automatically escape from nonmagical restraints, such as Manacles or a
      creature that has it &amp;reference[Grappled apply=false]. Finally, being
      Underwater imposes no penalties on the target's movement or attacks.</p>
