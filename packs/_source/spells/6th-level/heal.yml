type: spell
system:
  description:
    value: >-
      <p>Choose a creature that you can see within range. A surge of positive
      energy washes through the creature, causing it to regain 70 Hit Points.
      This spell also ends &amp;reference[blinded apply=false]{Blindness},
      &amp;reference[deafened apply=false]{Deafness}, and any diseases affecting
      the target. This spell has no effect on constructs or
      undead.</p><p><strong>At Higher Levels.</strong> When you cast this spell
      using a spell slot of 7th level or higher, the amount of healing increases
      by 10 for each slot level above 6th.</p>
