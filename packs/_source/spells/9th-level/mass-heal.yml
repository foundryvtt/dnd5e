name: Mass Heal
ownership:
  default: 0
type: spell
system:
  description:
    value: >-
      <p>A flood of Healing energy flows from you into injured creatures around
      you. You restore up to 700 Hit Points, divided as you choose among any
      number of creatures that you can see within range. Creatures healed by
      this spell are also cured of all Diseases and any effect making them
      &amp;reference[Blinded apply=false] or &amp;reference[Deafened
      apply=false]. This spell has no effect on Undead or constructs.</p>
