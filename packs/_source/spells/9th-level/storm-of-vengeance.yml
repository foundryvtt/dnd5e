_id: 7KjExw0kmuqERa7C
name: Storm of Vengeance
ownership:
  default: 0
type: spell
system:
  description:
    value: >-
      <p><strong>Range:</strong> sight</p><p>A churning storm cloud forms,
      centered on a point you can see and spreading to a radius of 360 feet.
      Lightning flashes in the area, thunder booms, and strong winds roar. Each
      creature under the cloud (no more than 5,000 feet beneath the cloud) when
      it appears must make a Constitution saving throw. On a failed save, a
      creature takes 2d6 thunder damage and becomes &amp;reference[Deafened
      apply=false] for 5 minutes.</p><p>Each round you maintain Concentration on
      this spell, the storm produces different Effects on your
      turn.</p><p><strong>Round 2</strong>. Acidic rain falls from the cloud.
      Each creature and object under the cloud takes 1d6 acid
      damage.</p><p><strong>Round 3</strong>. You call six bolts of lightning
      from the cloud to strike six creatures or objects of your choice beneath
      the cloud. A given creature or object can't be struck by more than one
      bolt. A struck creature must make a Dexterity saving throw. The creature
      takes 10d6 lightning damage on a failed save, or half as much damage on a
      successful one.</p><p><strong>Round 4</strong>. Hailstones rain down from
      the cloud. Each creature under the cloud takes 2d6 bludgeoning
      damage.</p><p><strong>Round 5–10</strong>. Gusts and freezing rain assail
      the area under the cloud. The area becomes &amp;reference[difficult
      terrain] and is &amp;reference[heavily obscured]. Each creature there
      takes 1d6 cold damage. Ranged weapon attacks in the area are impossible.
      The wind and rain count as a &amp;reference[concentration]{Severe
      Distraction} for the purposes of maintaining Concentration on Spells.
      Finally, gusts of strong wind (ranging from 20 to 50 miles per hour)
      automatically disperse fog, mists, and similar phenomena in the area,
      whether mundane or magical.</p>
