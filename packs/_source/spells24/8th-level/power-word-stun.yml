name: Power Word Stun
system:
  description:
    value: >-
      <p>You overwhelm the mind of one creature you can see within range. If the
      target has 150 Hit Points or fewer, it has the Stunned condition.
      Otherwise, its Speed is 0 until the start of your next turn.</p><p>The
      &amp;Reference[Stunned apply=false] target makes a [[/save ability=con
      dc=@attributes.spell.dc]] saving throw at the end of each of its turns,
      ending the condition on itself on a success.</p>
