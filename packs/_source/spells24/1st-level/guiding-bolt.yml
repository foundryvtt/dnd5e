name: Guiding Bolt
system:
  description:
    value: >-
      <p>You hurl a bolt of light toward a creature within range. Make a ranged
      spell attack against the target. On a hit, it takes 4d6 Radiant damage,
      and the next attack roll made against it before the end of your next turn
      has Advantage.</p><p><strong>Using a Higher-Level Spell Slot.</strong> The
      damage increases by 1d6 for each spell slot level above 1.</p>
