name: Ice Storm
system:
  description:
    value: >-
      <p>Hail falls in a 20-foot-radius, 40-foot-high Cylinder centered on a
      point within range. Each creature in the Cylinder makes a Dexterity saving
      throw. A creature takes 2d10 Bludgeoning damage and 4d6 Cold damage on a
      failed save or half as much damage on a successful one.</p><p>Hailstones
      turn ground in the Cylinder into &amp;Reference[DifficultTerrain] until
      the end of your next turn.</p><p><strong>Using a Higher-Level Spell
      Slot.</strong> The Bludgeoning damage increases by 1d10 for each spell
      slot level above 4.</p>
